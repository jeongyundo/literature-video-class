<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사진의 타이밍 문단 탐험</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<style>
/* Layout: 문단 목록 | 밤 공원 무대(질문·그림·자막·조작) | 쉬운 문장·원문·낱말. 좁으면 목록이 위로, 자료가 아래로 내려간다. */
:root{
  --bg:#eceff6; --surface:#ffffff; --ink:#141a2d; --muted:#596181; --line:#d6dbe8;
  --accent:#2a61d6; --accent-ink:#ffffff; --hot:#c95f17; --meta:#6a4bd0; --ok:#12805a; --bad:#bf3a31;
  --mark:#ffe1c2; --chip:#e2e7f3; --stage:#090e21; --stage-2:#141c3c;
  --ex:#150b29; --ex-2:#2c1852; --exb:#7a4fd6;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --serif:"Nanum Myeongjo","AppleMyungjo",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0e1b; --surface:#121a2e; --ink:#e5e9f5; --muted:#97a0bd; --line:#252e48;
  --accent:#6ea4ff; --accent-ink:#0a0e1b; --hot:#ff9a3c; --meta:#b28cff; --ok:#3fcf92; --bad:#ff6f61;
  --mark:#4c3217; --chip:#1c2540; --stage:#060a18; --stage-2:#111934; --ex:#100720; --ex-2:#26144a; --exb:#b892ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0e1b; --surface:#121a2e; --ink:#e5e9f5; --muted:#97a0bd; --line:#252e48;
  --accent:#6ea4ff; --accent-ink:#0a0e1b; --hot:#ff9a3c; --meta:#b28cff; --ok:#3fcf92; --bad:#ff6f61;
  --mark:#4c3217; --chip:#1c2540; --stage:#060a18; --stage-2:#111934; --ex:#100720; --ex-2:#26144a; --exb:#b892ff; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{max-width:1440px;margin:0 auto 12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:800;font-size:24px;letter-spacing:-.01em}
.brand small{font-family:var(--sans);font-weight:500;font-size:13px;color:var(--muted);margin-left:10px;letter-spacing:0}
.count{font-family:var(--mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.app{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:184px minmax(0,1fr) 320px;gap:18px;align-items:start}
nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
nav button{width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px;display:flex;gap:10px;align-items:baseline;color:var(--muted)}
nav button .n{font-family:var(--mono);font-size:12px;width:20px;font-variant-numeric:tabular-nums}
nav button:hover{background:var(--chip);color:var(--ink)}
nav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
nav button.done .n::after{content:"✓";margin-left:2px;color:var(--ok)}
nav button[aria-current="true"].done .n::after{color:inherit}
main{min-width:0;display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--hot)}
h1{margin:0;font-family:var(--serif);font-weight:800;font-size:clamp(21px,2.4vw,28px);line-height:1.35;text-wrap:balance}
.stage{position:relative;border-radius:14px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,var(--stage-2),var(--stage));aspect-ratio:800/480;max-width:100%}
.stage svg{display:block;width:100%;height:100%}
.stage.ex{background:radial-gradient(120% 90% at 30% 20%,var(--ex-2),var(--ex))}
.stage svg text{font-family:var(--sans)}
.tagline{margin-left:auto;font-size:12px;color:var(--muted)}
.capbar{display:flex;flex-direction:column;gap:4px;min-height:58px}
#cap{margin:0;font-size:19px;font-weight:600;line-height:1.45}
#note{margin:0;font-size:14px;color:var(--muted)}
#say{margin:0;display:flex;gap:8px;align-items:baseline;font-size:16px;font-weight:600;line-height:1.45}
#say b{flex:none;font-size:12px;padding:1px 8px;border-radius:999px;border:1.5px solid currentColor}
#say span{color:var(--ink)}
.say-m{color:var(--accent)} .say-a{color:var(--hot)} .say-q{color:var(--meta)} .say-p{color:var(--muted)}
#note.bad{color:var(--bad)} #note.good{color:var(--ok)}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)} .dots i.now{background:var(--hot);transform:scale(1.25)}
.tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-top:-4px}
.tools .btn{padding:6px 12px;font-size:14px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.controls .ask{width:100%;font-size:16px;font-weight:600;margin:0}
.controls .btn.primary{width:100%;padding:15px 18px;font-size:18px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.controls .btn.primary small{font-family:var(--mono);font-size:13px;font-weight:500;opacity:.8}
.controls .btn.choice{flex:1 1 220px;padding:14px 16px;font-size:17px;border-width:2px;border-radius:12px}
.quiz h2{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.pager .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.choice{border-color:var(--accent);color:var(--accent);background:var(--surface);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.spacer{flex:1}
.final{border:1px dashed var(--accent);border-radius:12px;padding:12px 14px;background:var(--surface)}
.final b{display:block;font-size:12px;color:var(--accent);letter-spacing:.06em;margin-bottom:2px}
.final p{margin:0;font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.5}
.final .nx{font-family:var(--sans);font-weight:500;font-size:14px;color:var(--muted);margin-top:6px}
aside{min-width:0;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2,.panel summary{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
details.panel summary{cursor:pointer;list-style:none;margin:0}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::after{content:"▾";float:right}
details.panel:not([open]) summary::after{content:"▸"}
details.panel[open] summary{margin-bottom:8px}
.role{font-weight:700;font-size:16px;margin:0}
.goal{margin:4px 0 0;color:var(--muted);font-size:14px}
blockquote{margin:0;font-family:var(--serif);font-size:15.5px;line-height:1.85}
blockquote mark{background:var(--mark);color:inherit;padding:1px 2px;border-radius:3px;font-weight:700}
blockquote u{text-decoration-color:var(--muted);text-underline-offset:3px}
.link{border:0;background:none;padding:0;margin-top:8px;color:var(--accent);font-weight:600;font-size:14px}
.qq{margin:0 0 10px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 11px}
.opts button:hover{border-color:var(--accent)}
.opts button.right{border-color:var(--ok);color:var(--ok);font-weight:700}
.opts button.wrong{border-color:var(--bad);color:var(--bad)}
.opts button.used{opacity:.4}
.picked{min-height:22px;font-size:14px;margin:0 0 8px;color:var(--accent);font-weight:600}
.fb{margin:10px 0 0;font-size:14px}
.fb.good{color:var(--ok)} .fb.bad{color:var(--bad)}
.easy p{margin:0 0 9px;font-size:14.5px;line-height:1.6}
.easy p:last-child{margin:0}
.easy p b{display:block;font-size:13px;color:var(--accent)}
.pager{max-width:1440px;margin:16px auto 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pager .hint{flex:1;min-width:0;color:var(--muted);font-size:14px;text-align:center}
@media (max-width:1120px){
  .app{grid-template-columns:minmax(0,1fr) 300px}
  nav{grid-column:1/-1;overflow-x:auto}
  nav ol{flex-direction:row;gap:4px;padding-bottom:4px}
  nav button{white-space:nowrap;width:auto}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  #cap{font-size:17px}
  .pager .hint{order:3;width:100%;flex-basis:100%}
}
.band{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:13px;color:var(--muted)}
.band span{padding:3px 10px;border-radius:999px;background:var(--chip)}
.band span.past{color:var(--ink)}
.band span.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.band i{font-style:normal;opacity:.6}
.controls .btn.ex{width:100%;padding:14px 18px;font-size:17px;border-radius:12px;border:2px solid var(--exb);color:var(--exb);background:var(--surface);font-weight:700;text-align:left}
.ez p{margin:0 0 10px;font-size:15px;line-height:1.65}
.ez p:last-child{margin:0}
.ez .es{margin:0 0 10px}.ez .es:last-child{margin:0}.ez .es p{margin:0}
.ez p b{color:var(--accent);margin-right:6px;font-family:var(--mono)}
.ez .cut{display:block;margin-top:2px;font-size:13px}
.ez .cutt{display:block;margin-top:4px;padding:6px 9px;border-radius:8px;background:var(--chip);color:var(--ink);font-size:13.5px}
.map{width:100%;border-collapse:collapse;font-size:14px}
.map td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
.map td:nth-child(2){width:24px;text-align:center;color:var(--muted)}
.map td:first-child{color:var(--exb);font-weight:600}
/* 칠판: 페이지 위 투명한 판 + 아래쪽 도구 막대 */
.topr{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:flex-end}
#bBoard{padding:6px 12px;font-size:14px;font-weight:600}
#bBoard[aria-pressed="true"]{background:var(--hot);border-color:var(--hot);color:var(--accent-ink)}
#board{position:fixed;left:0;top:0;width:100%;height:100%;z-index:40;touch-action:none;cursor:crosshair}
.boardbar{position:fixed;z-index:41;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100vw - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:8px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 24px rgba(10,14,30,.22)}
.boardbar button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:7px 11px;font-size:14px;font-weight:600}
.boardbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.boardbar .sw{display:flex;gap:6px;padding:0 4px}
.boardbar .sw button{width:30px;height:30px;padding:0;border-radius:50%;background:var(--c);border:2px solid var(--line)}
.boardbar .sw button[aria-pressed="true"]{background:var(--c);border-color:var(--ink);outline:3px solid var(--accent);outline-offset:2px}
body.board-on{padding-bottom:120px}
@media (max-width:760px){body.board-on{padding-bottom:200px}}
/* 수업 연결: 상태 칩 · 알림 · 학생 상태 창 · 전체화면 안내 · 학생 화면(따라보기) */
.live{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;cursor:default}
.live::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:currentColor}
.live.ok{color:var(--ok);border-color:var(--ok)} .live.warn{color:var(--hot);border-color:var(--hot)} .live.bad{color:var(--bad);border-color:var(--bad);border-width:2px}
.live.own{cursor:pointer}
#bView{padding:6px 12px;font-size:14px}
#bView[aria-pressed="true"]{background:var(--meta);border-color:var(--meta);color:var(--accent-ink)}
.toast{position:fixed;z-index:70;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:12px;background:var(--surface);border:2px solid var(--line);box-shadow:0 6px 24px rgba(10,14,30,.25);font-size:15px;font-weight:700}
.toast.bad{border-color:var(--bad);color:var(--bad)} .toast.warn{border-color:var(--hot);color:var(--hot)} .toast.good,.toast.info{border-color:var(--ok);color:var(--ok)}
.mon{position:fixed;z-index:65;top:calc(60px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:min(360px,calc(100vw - 32px));max-height:min(72vh,600px);overflow:auto;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 30px rgba(10,14,30,.25);font-size:14px}
.mon h2{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.mon .who{margin:0 0 12px;padding:9px 11px;border-radius:10px;background:var(--bg);line-height:1.7}
.mon .who b{display:block}
.mon ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.mon li{display:flex;gap:8px;align-items:baseline} .mon li time{flex:none;font-family:var(--mono);font-size:12px;color:var(--muted)}
.mon li.bad{color:var(--bad)} .mon li.warn{color:var(--hot)} .mon li.good{color:var(--ok)}
.mon .tip{margin:10px 0 0;color:var(--muted);font-size:13px}
.gate{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:var(--bg)}
.gate>div{max-width:460px;text-align:center}
.gate h2{margin:0 0 8px;font-family:var(--serif);font-weight:800;font-size:26px;line-height:1.35}
.gate p{margin:0 0 20px;color:var(--muted);font-size:16px}
.gate .btn{padding:15px 28px;font-size:18px;border-radius:12px}
.gate small{display:block;margin-top:16px;color:var(--muted);font-size:13px}
body.view #bBoard,body.view #tools,body.view #bNext,body.view #bEx,body.view #prevP,body.view #nextP{display:none!important}
body.view #board{pointer-events:none!important;cursor:default}
body.view main .btn,body.view nav button,body.view .opts button,body.view summary,body.view .link{cursor:default}
body.view.board-on{padding-bottom:28px}
.controls .btn.ex small{display:block;margin-top:2px;font-size:13px;font-weight:500;opacity:.85}
.say-w{color:#0f7f8f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .say-w{color:#57d9e6}}
:root[data-theme="dark"] .say-w{color:#57d9e6}
@media (prefers-reduced-motion: reduce){ .dots i.now{transform:none} }
</style>


<header class="top" data-a="top">
  <div class="brand" data-a="brand">사진의 타이밍, 인생의 타이밍<small>독서와 작문 3단원 · 김경훈 · 본문 23문단</small></div>
  <div class="topr"><button class="live vok" id="live" type="button" hidden></button><button class="btn vok" id="bView" type="button" aria-pressed="false" hidden>학생 화면 보기</button><button class="btn" id="bBoard" type="button" aria-pressed="false">칠판 켜기</button><div class="count" id="count">01 / 18</div></div>
</header>

<div class="app" data-a="app">
  <nav aria-label="문단 목록" data-a="nav"><ol id="nav"></ol></nav>
  <main data-a="main">
    <div class="band" id="band" aria-label="글 전체 흐름" data-a="band" data-s="band"></div>
    <div class="qhead" data-s="head"><span class="eyebrow" id="eyebrow" data-a="eyebrow"></span><h1 id="q" data-a="q"></h1></div>
    <div class="stage" id="stage" data-a="stage" data-s="stage">
      <svg viewBox="0 0 800 480" id="svg" role="img" aria-labelledby="cap">
        <defs id="defs"></defs><g id="stars"></g><g id="layer"></g>
      </svg>
    </div>
    <div class="tools" id="tools" data-a="tools"></div>
    <div class="capbar" data-s="cap">
      <p id="say" data-a="say" hidden></p>
      <p id="cap" data-a="cap" aria-live="polite"></p>
      <p id="note" data-a="note"></p>
      <div class="dots" data-a="dotsl"><span id="dots" class="dots" aria-hidden="true"></span><span class="tagline" id="tag" data-a="tag"></span></div>
    </div>
    <div class="controls" id="controls" data-a="ctl" data-s="ctl"></div>
    <div class="final" id="final" data-a="final" data-s="final" hidden><b>핵심 한 문장</b><p id="finalT" data-a="finalT"></p><p class="nx" id="finalN" data-a="finalN"></p></div>
    <section class="panel quiz" id="quizBox" data-a="quiz" data-s="quiz" hidden><h2>확인 질문</h2><p class="qq" id="qq" data-a="qq"></p><p class="picked" id="picked" hidden></p><div class="opts" id="qopts"></div><p class="fb" id="qfb" data-a="qfb"></p></section>
  </main>
  <aside data-a="aside">
    <section class="panel" data-a="rolep" data-s="rolep"><h2>이 문단의 역할</h2><p class="role" id="role" data-a="role"></p><p class="goal" id="goal" data-a="goal"></p></section>
    <section class="panel ez" id="ezBox" data-a="ezBox" data-s="ez"><h2 id="ezH" data-a="ezH">쉬운 문장</h2><div id="ez"></div></section>
    <details class="panel" id="srcBox" data-a="srcBox" data-s="src" open><summary>원문 근거</summary><blockquote id="src" data-a="src"></blockquote><button class="link" id="full" type="button">문단 전체 읽기</button></details>
    <details class="panel easy" id="easyBox" data-a="easyBox" data-s="easy" open><summary>낱말 풀이</summary><div id="easy" data-a="easy"></div></details>
  </aside>
</div>

<footer class="pager" data-a="pager" data-s="pager">
  <button class="btn" id="prevP" type="button">← 이전 문단</button>
  <span class="hint" id="hint" data-a="hint"></span>
  <button class="btn" id="nextP" type="button">다음 문단 →</button>
</footer>

<canvas id="board" hidden aria-hidden="true"></canvas>
<div class="boardbar" id="boardBar" role="toolbar" aria-label="칠판 도구" hidden>
  <button type="button" data-tool="hand">손</button>
  <button type="button" data-tool="pen">펜</button>
  <button type="button" data-tool="hl">형광펜</button>
  <button type="button" data-tool="eraser">지우개</button>
  <span class="sw">
    <button type="button" data-col="pen|#e5484d" aria-label="빨강" style="--c:#e5484d"></button>
    <button type="button" data-col="pen|#2a61d6" aria-label="파랑" style="--c:#2a61d6"></button>
    <button type="button" data-col="pen|#141a2d" aria-label="검정" style="--c:#141a2d"></button>
    <button type="button" data-col="pen|#ffffff" aria-label="흰색" style="--c:#ffffff"></button>
    <button type="button" data-col="hl|#ffe14d" aria-label="노랑" style="--c:#ffe14d"></button>
    <button type="button" data-col="hl|#7cf08a" aria-label="연두" style="--c:#7cf08a"></button>
    <button type="button" data-col="hl|#ff8fc7" aria-label="분홍" style="--c:#ff8fc7"></button>
  </span>
  <button type="button" id="bUndo">되돌리기</button>
  <button type="button" id="bClear">모두 지우기</button>

<script>

const C={txt:'#e6ebf7',dim:'#8b94b0',sp:'#f4f6ff',q:'#5aa2ff',hot:'#ff9a3c',grav:'#43d2a6',meta:'#b892ff',pred:'#8d96ad',bad:'#ff6b6b',line:'#3a4363',bg:'rgba(8,12,28,.86)',card:'rgba(20,28,58,.95)',cell:'#0d1430'};

const sub=(t,a,b)=>cl((t-a)/(b-a));

const tw=(s,z)=>{let w=0;for(const ch of s)w+=/[ -~]/.test(ch)?z*.56:z*.98;return w;};
let FS=1,SM=false;
/* o.m = 작은 이름표(휴대폰·세로 태블릿에서 숨김). 글자는 무대 밖으로 나가지 않게 x를 안쪽으로 당긴다 */
const tx=(x,y,s,o={})=>{if(o.m&&SM)return '';const z=(o.z||15)*FS,w=tw(String(s),z),a=o.a||'start';

  return `<text x="${f1(x)}" y="${f1(y)}" font-size="${f1(z)}" fill="${o.c||C.txt}" text-anchor="${a}" font-weight="${o.w||500}">${s}</text>`;};
function pill(x,y,s,o={}){if(o.m&&SM)return '';const z=(o.z||14)*FS,w=tw(s,z)+22,h=z+14;let x0=o.a==='start'?x:o.a==='end'?x-w:x-w/2;x0=cl(x0,6,Math.max(6,794-w));

const ln=(x1,y1,x2,y2,c,o={})=>`<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="${c}" stroke-width="${o.w||2}"${o.dash?` stroke-dasharray="${o.dash}"`:''} stroke-linecap="round"/>`;

const mix=(a,b,t)=>{const h=s=>[1,3,5].map(j=>parseInt(s.slice(j,j+2),16)),A=h(a),B=h(b);return '#'+A.map((v,j)=>Math.round(L(v,B[j],cl(t))).toString(16).padStart(2,'0')).join('');};

function char(who,o={}){const lf=o.side?o.side==='l':who==='m',x=lf?92:708,y=296,c=K[who];
  let s=`<circle cx="${x}" cy="${y-60}" r="15" fill="${K.head}"/><path d="M${x-17} ${y}V${y-26}Q${x-17} ${y-43} ${x} ${y-43}Q${x+17} ${y-43} ${x+17} ${y-26}V${y}Z" fill="${{m:'#34497f',a:'#6a4636',w:'#2b5a60'}[who]}"/>`;
  if(who==='m')s+=`<path d="M${x-15} ${y-41}Q${x} ${y-33} ${x+15} ${y-41}L${x+13} ${y-34}Q${x} ${y-26} ${x-13} ${y-34}Z" fill="${K.m}"/>`;

  return `<path d="M${f1(tx0-8)} ${f1(y0+h-1)}L${f1(ax)} ${f1(ay)}L${f1(tx0+8)} ${f1(y0+h-1)}Z" fill="${C.card}" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/>`+
    bx(x0,y0,w,h,{r:12,f:C.card,c:col,w:1.8,dash:o.dash})+`<rect x="${f1(tx0-7)}" y="${f1(y0+h-3)}" width="14" height="4.5" fill="${C.card}"/>`+tx(x0+w/2,y0+h/2+z*.36,s,{a:'middle',z:o.z||15,c:C.txt,w:600});}

const SPK={m:[110,222],a:[690,222],w:[690,222],wl:[110,222]};

/* 하루 시간 띠(해의 길): 4시~20시를 x0~x1에 놓는다. 금빛 칸 = 매직 아워(일출·일몰 앞뒤) — 칸 폭은 그림용이고 실제 시각이 아니다 */

function mkDay(x0=150,x1=650,y=430,H=130){

    zone(j,o={}){const [a,b]=MH[j];return G(o.op??1,`<rect x="${f1(X(a))}" y="${f1(y-H-16)}" width="${f1(X(b)-X(a))}" height="${f1(H+16)}" rx="6" fill="${o.f||'url(#gz)'}" opacity="${o.fo??1}"/>`+ZG+(o.lab===0?'':pill((X(a)+X(b))/2,y-H-30,o.lab||'매직 아워',{z:12,c:o.c||K.gold,fc:o.fc||o.c||K.gold,m:o.lm??0})));},

const PARA=["“모든 일에는 다 때가 있다.”", "누구나 살면서 이런 말을 한 번쯤 들어 봤을 겁니다. 열심히 공부해야 할 때, 열심히 일해야 할 때, 연애와 결혼을 해야 할 때가 있다고 하지요. ‘모든 일에는 다 때가 있다.’라는 말에 쉽게 반박하지 못하는 이유는 최적의 때를 잘 찾아야 성공할 가능성이 높아진다는 데 수긍하기 때문인지도 모르지요.", "세상의 모든 일에 좋은 때가 있듯 사진 촬영에도 좋은 때가 있습니다. 바로 빛의 타이밍인데요. 빛의 방향과 강약 그리고 빛이 만들어 주는 색감에 따라서 똑같은 피사체도 다르게 보일 때가 많습니다. 거리를 스튜디오 삼아 자연의 태양광을 조명으로 이용하는 일이 많은 사진 기자에게는 타이밍이 매우 중요합니다.", "가장 아름답고 인상적인 효과를 만들어 주는 빛의 시간대가 있는데 이를 매직 아워(magic hour)라고 부릅니다. 일출과 일몰 전후의 30분에서 60분 남짓한 짧은 시간입니다. 뭘 찍든 멋있게 보이는 마법 같은 힘을 지녔기에 매직 아워라고 부르지 않을까 짐작해 봅니다. 취미 사진가도 잘 알고 있는 이 매직 아워의 힘을 제대로 느끼고 사용하게 되기까지는 제법 긴 시간이 걸렸답니다.", "한국의 신문사에서 사진 기자를 시작할 무렵 제가 부러워한 사진은 주로 외신 사진이었습니다. 제가 찍은 사진보다 훨씬 입체감 있고 다양한 계조가 살아 있으며 강렬함이 있었거든요. 지금 일하고 있는 외신으로부터 일자리 제안을 받았을 때 덥석 받아들인 이유 중 하나가 사실 여기에 있습니다. 외신 사진처럼 색감이 다채로운 사진을 찍고 싶었기 때문입니다.", "그때나 지금이나 시각적으로 완성도 높은 사진을 찍고 싶은 이유는, 사진 기자는 두 가지 다른 영역에 두 발을 딛고 있다고 생각하기 때문입니다. 하나는 언제나 공정하고 정확하게 뉴스를 전달하는 저널리즘의 영역, 다른 하나는 때로는 강렬하고 때로는 아름다운 사진을 찍어야 하는 사진 미학의 영역입니다. 사진이 강렬하고 아름다울 때 사진이 전달하고자 하는 내용에 더 많은 사람이 관심을 기울이기에, 미학적으로 완성도 있는 사진을 촬영하려는 것입니다. 한쪽으로 치우침이 없이 두 발을 양쪽에 균형 있게 딛고 서 있는 것이 이상적인 보도 사진이라고 생각합니다.", "부푼 마음으로 외신에서 일하기 시작했지만 안타깝게도 하루아침에 멋들어진 사진을 찍지는 못했습니다. 회사를 옮기고서 앵글도 프레임도 많이 바꾸어 봤지만 언제나 성에 차지 않았고 두 발은 균형을 잡지 못했답니다. 왜 내 사진은 같은 회사의 다른 나라 지국에서 일하는 사진 기자들의 사진처럼 색감이 다채롭지 않고 시각적으로 깊은 인상을 주지 못할까, 하는 의문은 풀리지 않았지만 한두 차례의 비슷한 경험을 겪고 자연스럽게 그 해답을 찾아내게 되었습니다. 그중 하나의 일입니다.", "2004년 12월 26일, 인도양에서 거대한 지진 해일이 일어났습니다. 이 지진 해일로 스리랑카, 몰디브, 태국, 인도, 인도네시아 등에서 거대한 피해가 발생했고 전 세계에서 28만 명 이상이 사망했습니다. 저는 가장 피해가 심한 인도네시아의 반다아체 지방으로 급파되었습니다. 사진 기자가 되고 처음으로 경험해 보는 참혹한 자연재해 현장이었습니다. 여러 외국 지국에서 유명한 사진 기자 선배들이 오기에 많은 것을 배울 기회이기도 했습니다. 당시 여러 아시아 지국에서도 가장 어린 사진 기자였던 저는 많은 국제 뉴스의 현장에서 다양한 경험을 해 온 베테랑 사진 기자들이 일하는 모습을 곁에서 지켜볼 수 있었지요.", "현지 주민의 집에 임시로 차린 베이스캠프에서 맞이한 첫 아침. 처음 경험하는 재난 뉴스의 해외 출장에서 뭔가를 보여 주고 싶은 의욕으로 가득해서 아침을 든든히 챙겨 먹고 평소 업무를 시작하는 오전 9시가 되면 현장으로 나갈 준비를 하고 있었습니다. 그런데 아침 식사 시간에도, 9시가 다 되어 가는데도 다른 사진 기자는 보이지 않았습니다.", "피곤해서 자고 있나, 어디 갔나 생각하는 중에 사진 기자 선배들이 하나둘 들어왔습니다. 그들은 이미 새벽에 나가 취재를 하고 돌아온 것이었습니다. 그리고 노트북을 펼쳐 편집하는 사진들을 뒤에서 지켜보니 제가 그토록 원하던 사진들이 거기에 있었습니다. 그들은 매직 아워에 맞춰 아침 일찍 취재를 시작했고, 매직 아워 이후에도 이른 아침의 해가 낮은 각도에서 피사체를 비추면서 사진을 입체적으로 보이게 만들어 주는 때를 놓치지 않았던 것입니다. 선배 기자들은 오후 3시가 되자 다시 현장으로 나갔습니다. 해가 뉘엿뉘엿 지기 시작하면서 태양광이 긴 그림자를 만들기 시작하는 오후 4시부터 해 질 무렵의 매직 아워에 사진을 취재하기 위해 미리 현장으로 나가는 것이었습니다.", "하루 동안 베테랑 사진 기자들이 일하는 방식을 곁눈질로 보고 나니 제 문제가 무엇인지 알 수 있었습니다. 사진에서 가장 중요한 것은 빛인데, 저는 좋은 빛을 포착하기 위한 고민을 하지 않았던 겁니다. 한국에서 일할 때는 특별한 취재 일정이 없는 한 9시에 일을 시작해서 오후 4시면 마감을 끝내고 6시면 집에 들어갈 준비를 하는 방식으로 일해 왔으니 매직 아워를 매일 놓치고 있었던 것이지요. 그동안 해가 중천에 뜬 후에 가장 평범하고 재미없는 조명으로 사진을 찍어 왔던 것입니다. 빛이 가장 아름다운 타이밍을 놓치고 있었으니 원하는 촬영을 할 기회를 매일매일 놓쳤던 셈입니다.", "그날부터 제 사진은 달라지기 시작했습니다. 매직 아워의 시간대, 태양이 낮은 고도에서 피사체에 역동적인 조명과 그림자를 선사하는 이른 오전과 늦은 오후의 시간대를 적극적으로 이용하게 되었습니다. 그때부터는 단순히 뉴스를 쫓아 눈에 보이는 대로 카메라의 셔터를 누르기보다는, 보여 주고 싶은 뉴스를 어떻게 하면 더욱 시각적으로 강렬하게 보여 줄지 고민하며 빛을 효과적으로 사용할 방법을 진지하게 찾게 되었습니다.", "사진 속 빛에 눈을 뜨면서 또 하나 알게 된 것은 준비와 계획의 중요성이었습니다. 불과 몇 분 차이로 변화무쌍하게 바뀌는 매직 아워 속 빛과 색을 포착하려면 항상 계획을 세워 놓고 준비해야 합니다. 카메라에 무엇을 담고 싶은지 미리 생각해 두지 않으면 허둥지둥하다 때를 놓치기 십상입니다. 그날의 매직 아워가 언제인지 알아보고 적어도 30분 전에는 그 장소에 가서 기다려야 합니다. 준비된 자만이 성공의 기회를 잡는다는 격언처럼, 준비하고 계획을 짜야 좋은 사진도 찍을 수 있다는 사실을 깨달았지요.", "여기까지 적고 보니, “인생은 타이밍이 중요하고 준비된 자만이 기회를 잡을 수 있으니 항상 준비하고 열심히 살아라!” 같은 이야기처럼 보이기도 하네요. 그렇다면 좋은 인생을 살기 위한 타이밍은 열심히 공부하고 미리미리 준비해야 잡을 수 있고 한번 놓치면 좀처럼 다시 찾아오지 않는 희귀한 순간일까요?", "사진 대가의 이야기를 들어보면 꼭 그렇지는 않은 것 같습니다. 20세기 사진 예술의 대가로 손꼽히는 프랑스의 사진작가 앙리 카르티에 브레송(Henri Cartier-Bresson)의 예술 세계는 ‘결정적 순간’으로 규정됩니다. 그의 사진 철학은 작업해 온 사진들을 모은 사진집 『결정적 순간』이 1952년에 출간되면서 세상에 알려졌지요. 이후 ‘결정적 순간’은 전 세계의 수많은 사진가를 사로잡은 위대한 담론이 되었습니다. 이 담론은 화면 속 모든 요소가 완벽하게 조화를 이루는 결정적 순간에 셔터를 눌러 그 순간의 정수를 포착한다는 의미를 담고 있습니다.", "대표적인 예가 1932년 파리의 생 라자르 역(Gare St. Lazare) 뒤쪽의 공사장에서 촬영한 사진입니다. 브레송의 초창기 대표작인 이 사진은 물웅덩이 사진이라고도 불립니다. 웅덩이 위를 점프해 지나는 어느 사내의 모습이 포착된, 언뜻 평범해 보이는 사진이지요. 하지만 천천히 사진을 음미해 보세요. 웅덩이를 뛰어넘는 남성의 발이 물에 닿기 직전의 순간이 보여 주는 역동감이 눈길을 끕니다. 그와 동시에 견고하게 구성된 화면은 역동성 속에서도 안정감을 선사하고 있으며, 지저분한 공사장과 회색 도시의 풍경은 흑백 사진으로 단순화되었고, 물웅덩이에 반사된 화면에서는 선과 원과 도형이 기하학적으로 완성된 형태를 띱니다.", "남성의 모습은 화면 뒤쪽에 보이는 서커스단의 포스터 속 댄서와 재미있는 대비를 이루고 있습니다. 순간을 영원한 이미지로 만드는 사진의 속성, 완벽한 구도 그리고 타이밍을 잡아낸 사진가의 능력이 만나 지저분한 도시의 풍경이 기하학적으로 완벽한 예술 사진이 된 것이지요. 여기서 우리는 일상의 풍경을 아름다운 예술 사진으로 바꾸는 힘을 느낄 수 있는데요. 이는 순간의 타이밍을 포착해서 만들어 낸 힘이기도 합니다.", "브레송 이후 반세기가 넘도록 수많은 사진가가 결정적 순간을 맛보기 위해 부단히 셔터를 눌렀지만, 그들 모두가 ‘결정적 순간’을 제대로 이해한 것 같지는 않습니다. 대부분은 셔터를 누를 타이밍을 잘 가늠하고 최고의 순간을 포착해야 한다고 생각했거든요. 한번 놓치면 다시 오지 않는 인생의 기회처럼요. 그래서 촬영한 사진을 보고는 타이밍을 제대로 맞추지 못해 놓쳐 버린 순간을 아까워하며 탄식을 터트리는 사진가가 참 많습니다. 저를 포함해서요.", "하지만 브레송의 결정적 순간은 셔터를 누르는 순간적인 기회 같은 단순한 개념이 아니었습니다. 그에게 사진이란 피사체와 호흡하는 것이며 실제로 존재하는 세상의 리듬을 이해하는 것이었습니다. 즉 그가 정립한 결정적 순간이란, 섬광처럼 홀연히 눈앞에 나타나는 짧은 순간이 아니라 세계에 대한 이해를 바탕으로 한 장의 사진이 도출되는 때에 카메라 셔터를 눌러 기록한 순간입니다. 브레송이 불교의 선문답같이 풀어놓은 결정적 순간은, 내가 아는 만큼 세상이 보이고 내가 이해하는 세상 속에 결정적 순간이 있다는 이야기인 것 같습니다.", "그가 말년의 인터뷰에서 보다 명확히 이야기한 것이 있습니다. 자신도 도대체 어떻게 결정적인 순간을 사진으로 포착하는지 잘 모르겠으며 그 과정은 수수께끼라고 고백한 것입니다. 그래서 사진에 관해, 결정적 순간에 대해 평생 그 누구에게도 가르치려 하지 않았다고 말했습니다. 하지만 분명히 알 수 있는 사실은 결정적 순간은 준비하고 기다리는 사람에게 찾아온다는 것입니다. 기하학적으로 완성된 사진의 프레임을 만들어 놓고 피사체에 집중하며 기다리다가 셔터를 누르면 결정적 순간이 포착된다고요.", "그리고 아주 중요한 이야기를 덧붙였습니다. 만약 사진을 잘못 찍었다면 그림을 그릴 때 지우개로 스케치를 쓱쓱 지우고 다시 그리듯 사진을 다시 찍으면 된다는 것입니다. 그가 이야기한 결정적 순간이란 별똥별처럼 잠시 눈앞에 나타났다가 사라지는 것이 아니었지요. 놓치면 다시 셔터를 눌러 포착할 수 있는 것이었습니다. 매일 태양이 떠오르고, 날마다 매직 아워가 돌아오는 것처럼요. 결정적 순간을 한번 놓치더라도 셔터를 또 누르면 포착할 수 있는 것처럼, 우리 주변에는 숱한 결정적 순간이 존재합니다. 눈앞에서 벌어지는 것이 무엇인지 정확히 이해할 수 있다면 말이지요.", "대학 입시를 준비하며 여러 사람에게 ‘공부에도 때가 있다.’라는 말을 들은 아들은 진로를 고민할 뿐만 아니라 인생의 중요한 타이밍을 놓치고 잘못된 선택을 하게 될까 봐 걱정하고 있었습니다. 아들에게 저는 이렇게 이야기해 주었습니다.", "“인생에 타이밍이 중요하다는 말은 맞는 것 같은데, 그 타이밍은 참 많이 찾아오더라. 오늘 새벽에 매직 아워를 놓쳤더라도 걱정할 필요는 없어. 저녁 해 질 무렵에 다시 매직 아워를 볼 수 있고, 내일도 해는 뜨고 또 질 테니까. 인생의 때를 놓쳤다고 초조해하지 말렴. 결정적 순간을 놓쳤으면 다시 한번 셔터를 누르면 된단다.”"];
const SENTS=[["“모든 일에는 다 때가 있다.”"], ["누구나 살면서 이런 말을 한 번쯤 들어 봤을 겁니다.", "열심히 공부해야 할 때, 열심히 일해야 할 때, 연애와 결혼을 해야 할 때가 있다고 하지요.", "‘모든 일에는 다 때가 있다.’라는 말에 쉽게 반박하지 못하는 이유는 최적의 때를 잘 찾아야 성공할 가능성이 높아진다는 데 수긍하기 때문인지도 모르지요."], ["세상의 모든 일에 좋은 때가 있듯 사진 촬영에도 좋은 때가 있습니다.", "바로 빛의 타이밍인데요.", "빛의 방향과 강약 그리고 빛이 만들어 주는 색감에 따라서 똑같은 피사체도 다르게 보일 때가 많습니다.", "거리를 스튜디오 삼아 자연의 태양광을 조명으로 이용하는 일이 많은 사진 기자에게는 타이밍이 매우 중요합니다."], ["가장 아름답고 인상적인 효과를 만들어 주는 빛의 시간대가 있는데 이를 매직 아워(magic hour)라고 부릅니다.", "일출과 일몰 전후의 30분에서 60분 남짓한 짧은 시간입니다.", "뭘 찍든 멋있게 보이는 마법 같은 힘을 지녔기에 매직 아워라고 부르지 않을까 짐작해 봅니다.", "취미 사진가도 잘 알고 있는 이 매직 아워의 힘을 제대로 느끼고 사용하게 되기까지는 제법 긴 시간이 걸렸답니다."], ["한국의 신문사에서 사진 기자를 시작할 무렵 제가 부러워한 사진은 주로 외신 사진이었습니다.", "제가 찍은 사진보다 훨씬 입체감 있고 다양한 계조가 살아 있으며 강렬함이 있었거든요.", "지금 일하고 있는 외신으로부터 일자리 제안을 받았을 때 덥석 받아들인 이유 중 하나가 사실 여기에 있습니다.", "외신 사진처럼 색감이 다채로운 사진을 찍고 싶었기 때문입니다."], ["그때나 지금이나 시각적으로 완성도 높은 사진을 찍고 싶은 이유는, 사진 기자는 두 가지 다른 영역에 두 발을 딛고 있다고 생각하기 때문입니다.", "하나는 언제나 공정하고 정확하게 뉴스를 전달하는 저널리즘의 영역, 다른 하나는 때로는 강렬하고 때로는 아름다운 사진을 찍어야 하는 사진 미학의 영역입니다.", "사진이 강렬하고 아름다울 때 사진이 전달하고자 하는 내용에 더 많은 사람이 관심을 기울이기에, 미학적으로 완성도 있는 사진을 촬영하려는 것입니다.", "한쪽으로 치우침이 없이 두 발을 양쪽에 균형 있게 딛고 서 있는 것이 이상적인 보도 사진이라고 생각합니다."], ["부푼 마음으로 외신에서 일하기 시작했지만 안타깝게도 하루아침에 멋들어진 사진을 찍지는 못했습니다.", "회사를 옮기고서 앵글도 프레임도 많이 바꾸어 봤지만 언제나 성에 차지 않았고 두 발은 균형을 잡지 못했답니다.", "왜 내 사진은 같은 회사의 다른 나라 지국에서 일하는 사진 기자들의 사진처럼 색감이 다채롭지 않고 시각적으로 깊은 인상을 주지 못할까, 하는 의문은 풀리지 않았지만 한두 차례의 비슷한 경험을 겪고 자연스럽게 그 해답을 찾아내게 되었습니다.", "그중 하나의 일입니다."], ["2004년 12월 26일, 인도양에서 거대한 지진 해일이 일어났습니다.", "이 지진 해일로 스리랑카, 몰디브, 태국, 인도, 인도네시아 등에서 거대한 피해가 발생했고 전 세계에서 28만 명 이상이 사망했습니다.", "저는 가장 피해가 심한 인도네시아의 반다아체 지방으로 급파되었습니다.", "사진 기자가 되고 처음으로 경험해 보는 참혹한 자연재해 현장이었습니다.", "여러 외국 지국에서 유명한 사진 기자 선배들이 오기에 많은 것을 배울 기회이기도 했습니다.", "당시 여러 아시아 지국에서도 가장 어린 사진 기자였던 저는 많은 국제 뉴스의 현장에서 다양한 경험을 해 온 베테랑 사진 기자들이 일하는 모습을 곁에서 지켜볼 수 있었지요."], ["현지 주민의 집에 임시로 차린 베이스캠프에서 맞이한 첫 아침.", "처음 경험하는 재난 뉴스의 해외 출장에서 뭔가를 보여 주고 싶은 의욕으로 가득해서 아침을 든든히 챙겨 먹고 평소 업무를 시작하는 오전 9시가 되면 현장으로 나갈 준비를 하고 있었습니다.", "그런데 아침 식사 시간에도, 9시가 다 되어 가는데도 다른 사진 기자는 보이지 않았습니다."], ["피곤해서 자고 있나, 어디 갔나 생각하는 중에 사진 기자 선배들이 하나둘 들어왔습니다.", "그들은 이미 새벽에 나가 취재를 하고 돌아온 것이었습니다.", "그리고 노트북을 펼쳐 편집하는 사진들을 뒤에서 지켜보니 제가 그토록 원하던 사진들이 거기에 있었습니다.", "그들은 매직 아워에 맞춰 아침 일찍 취재를 시작했고, 매직 아워 이후에도 이른 아침의 해가 낮은 각도에서 피사체를 비추면서 사진을 입체적으로 보이게 만들어 주는 때를 놓치지 않았던 것입니다.", "선배 기자들은 오후 3시가 되자 다시 현장으로 나갔습니다.", "해가 뉘엿뉘엿 지기 시작하면서 태양광이 긴 그림자를 만들기 시작하는 오후 4시부터 해 질 무렵의 매직 아워에 사진을 취재하기 위해 미리 현장으로 나가는 것이었습니다."], ["하루 동안 베테랑 사진 기자들이 일하는 방식을 곁눈질로 보고 나니 제 문제가 무엇인지 알 수 있었습니다.", "사진에서 가장 중요한 것은 빛인데, 저는 좋은 빛을 포착하기 위한 고민을 하지 않았던 겁니다.", "한국에서 일할 때는 특별한 취재 일정이 없는 한 9시에 일을 시작해서 오후 4시면 마감을 끝내고 6시면 집에 들어갈 준비를 하는 방식으로 일해 왔으니 매직 아워를 매일 놓치고 있었던 것이지요.", "그동안 해가 중천에 뜬 후에 가장 평범하고 재미없는 조명으로 사진을 찍어 왔던 것입니다.", "빛이 가장 아름다운 타이밍을 놓치고 있었으니 원하는 촬영을 할 기회를 매일매일 놓쳤던 셈입니다."], ["그날부터 제 사진은 달라지기 시작했습니다.", "매직 아워의 시간대, 태양이 낮은 고도에서 피사체에 역동적인 조명과 그림자를 선사하는 이른 오전과 늦은 오후의 시간대를 적극적으로 이용하게 되었습니다.", "그때부터는 단순히 뉴스를 쫓아 눈에 보이는 대로 카메라의 셔터를 누르기보다는, 보여 주고 싶은 뉴스를 어떻게 하면 더욱 시각적으로 강렬하게 보여 줄지 고민하며 빛을 효과적으로 사용할 방법을 진지하게 찾게 되었습니다."], ["사진 속 빛에 눈을 뜨면서 또 하나 알게 된 것은 준비와 계획의 중요성이었습니다.", "불과 몇 분 차이로 변화무쌍하게 바뀌는 매직 아워 속 빛과 색을 포착하려면 항상 계획을 세워 놓고 준비해야 합니다.", "카메라에 무엇을 담고 싶은지 미리 생각해 두지 않으면 허둥지둥하다 때를 놓치기 십상입니다.", "그날의 매직 아워가 언제인지 알아보고 적어도 30분 전에는 그 장소에 가서 기다려야 합니다.", "준비된 자만이 성공의 기회를 잡는다는 격언처럼, 준비하고 계획을 짜야 좋은 사진도 찍을 수 있다는 사실을 깨달았지요."], ["여기까지 적고 보니, “인생은 타이밍이 중요하고 준비된 자만이 기회를 잡을 수 있으니 항상 준비하고 열심히 살아라!” 같은 이야기처럼 보이기도 하네요.", "그렇다면 좋은 인생을 살기 위한 타이밍은 열심히 공부하고 미리미리 준비해야 잡을 수 있고 한번 놓치면 좀처럼 다시 찾아오지 않는 희귀한 순간일까요?"], ["사진 대가의 이야기를 들어보면 꼭 그렇지는 않은 것 같습니다.", "20세기 사진 예술의 대가로 손꼽히는 프랑스의 사진작가 앙리 카르티에 브레송(Henri Cartier-Bresson)의 예술 세계는 ‘결정적 순간’으로 규정됩니다.", "그의 사진 철학은 작업해 온 사진들을 모은 사진집 『결정적 순간』이 1952년에 출간되면서 세상에 알려졌지요.", "이후 ‘결정적 순간’은 전 세계의 수많은 사진가를 사로잡은 위대한 담론이 되었습니다.", "이 담론은 화면 속 모든 요소가 완벽하게 조화를 이루는 결정적 순간에 셔터를 눌러 그 순간의 정수를 포착한다는 의미를 담고 있습니다."], ["대표적인 예가 1932년 파리의 생 라자르 역(Gare St. Lazare) 뒤쪽의 공사장에서 촬영한 사진입니다.", "브레송의 초창기 대표작인 이 사진은 물웅덩이 사진이라고도 불립니다.", "웅덩이 위를 점프해 지나는 어느 사내의 모습이 포착된, 언뜻 평범해 보이는 사진이지요.", "하지만 천천히 사진을 음미해 보세요.", "웅덩이를 뛰어넘는 남성의 발이 물에 닿기 직전의 순간이 보여 주는 역동감이 눈길을 끕니다.", "그와 동시에 견고하게 구성된 화면은 역동성 속에서도 안정감을 선사하고 있으며, 지저분한 공사장과 회색 도시의 풍경은 흑백 사진으로 단순화되었고, 물웅덩이에 반사된 화면에서는 선과 원과 도형이 기하학적으로 완성된 형태를 띱니다."], ["남성의 모습은 화면 뒤쪽에 보이는 서커스단의 포스터 속 댄서와 재미있는 대비를 이루고 있습니다.", "순간을 영원한 이미지로 만드는 사진의 속성, 완벽한 구도 그리고 타이밍을 잡아낸 사진가의 능력이 만나 지저분한 도시의 풍경이 기하학적으로 완벽한 예술 사진이 된 것이지요.", "여기서 우리는 일상의 풍경을 아름다운 예술 사진으로 바꾸는 힘을 느낄 수 있는데요.", "이는 순간의 타이밍을 포착해서 만들어 낸 힘이기도 합니다."], ["브레송 이후 반세기가 넘도록 수많은 사진가가 결정적 순간을 맛보기 위해 부단히 셔터를 눌렀지만, 그들 모두가 ‘결정적 순간’을 제대로 이해한 것 같지는 않습니다.", "대부분은 셔터를 누를 타이밍을 잘 가늠하고 최고의 순간을 포착해야 한다고 생각했거든요.", "한번 놓치면 다시 오지 않는 인생의 기회처럼요.", "그래서 촬영한 사진을 보고는 타이밍을 제대로 맞추지 못해 놓쳐 버린 순간을 아까워하며 탄식을 터트리는 사진가가 참 많습니다.", "저를 포함해서요."], ["하지만 브레송의 결정적 순간은 셔터를 누르는 순간적인 기회 같은 단순한 개념이 아니었습니다.", "그에게 사진이란 피사체와 호흡하는 것이며 실제로 존재하는 세상의 리듬을 이해하는 것이었습니다.", "즉 그가 정립한 결정적 순간이란, 섬광처럼 홀연히 눈앞에 나타나는 짧은 순간이 아니라 세계에 대한 이해를 바탕으로 한 장의 사진이 도출되는 때에 카메라 셔터를 눌러 기록한 순간입니다.", "브레송이 불교의 선문답같이 풀어놓은 결정적 순간은, 내가 아는 만큼 세상이 보이고 내가 이해하는 세상 속에 결정적 순간이 있다는 이야기인 것 같습니다."], ["그가 말년의 인터뷰에서 보다 명확히 이야기한 것이 있습니다.", "자신도 도대체 어떻게 결정적인 순간을 사진으로 포착하는지 잘 모르겠으며 그 과정은 수수께끼라고 고백한 것입니다.", "그래서 사진에 관해, 결정적 순간에 대해 평생 그 누구에게도 가르치려 하지 않았다고 말했습니다.", "하지만 분명히 알 수 있는 사실은 결정적 순간은 준비하고 기다리는 사람에게 찾아온다는 것입니다.", "기하학적으로 완성된 사진의 프레임을 만들어 놓고 피사체에 집중하며 기다리다가 셔터를 누르면 결정적 순간이 포착된다고요."], ["그리고 아주 중요한 이야기를 덧붙였습니다.", "만약 사진을 잘못 찍었다면 그림을 그릴 때 지우개로 스케치를 쓱쓱 지우고 다시 그리듯 사진을 다시 찍으면 된다는 것입니다.", "그가 이야기한 결정적 순간이란 별똥별처럼 잠시 눈앞에 나타났다가 사라지는 것이 아니었지요.", "놓치면 다시 셔터를 눌러 포착할 수 있는 것이었습니다.", "매일 태양이 떠오르고, 날마다 매직 아워가 돌아오는 것처럼요.", "결정적 순간을 한번 놓치더라도 셔터를 또 누르면 포착할 수 있는 것처럼, 우리 주변에는 숱한 결정적 순간이 존재합니다.", "눈앞에서 벌어지는 것이 무엇인지 정확히 이해할 수 있다면 말이지요."], ["대학 입시를 준비하며 여러 사람에게 ‘공부에도 때가 있다.’라는 말을 들은 아들은 진로를 고민할 뿐만 아니라 인생의 중요한 타이밍을 놓치고 잘못된 선택을 하게 될까 봐 걱정하고 있었습니다.", "아들에게 저는 이렇게 이야기해 주었습니다."], ["“인생에 타이밍이 중요하다는 말은 맞는 것 같은데, 그 타이밍은 참 많이 찾아오더라.", "오늘 새벽에 매직 아워를 놓쳤더라도 걱정할 필요는 없어.", "저녁 해 질 무렵에 다시 매직 아워를 볼 수 있고, 내일도 해는 뜨고 또 질 테니까.", "인생의 때를 놓쳤다고 초조해하지 말렴.", "결정적 순간을 놓쳤으면 다시 한번 셔터를 누르면 된단다.”"]];
const EZ=[["\"세상 모든 일에는 다 알맞은 때가 있다.\""], ["누구나 살면서 이 말을 한 번쯤은 들어 봤을 것이다.", "사람들은 열심히 공부해야 할 때, 열심히 일해야 할 때, 연애하고 결혼해야 할 때가 따로 있다고 말한다.", "사람들이 이 말에 쉽게 \"아니야\"라고 하지 못하는 이유가 있다. 가장 알맞은 때(최적의 때)를 잘 찾아야 성공할 가능성이 높아진다는 것을 다들 인정(수긍)하기 때문일지도 모른다."], ["세상 모든 일에 좋은 때가 있는 것처럼, 사진을 찍는 데에도 좋은 때가 있다.", "그것은 바로 빛의 타이밍이다.", "빛이 어느 쪽에서 오는지(방향), 얼마나 센지(강약), 어떤 색 느낌을 내는지(색감)에 따라 똑같은 대상(피사체)도 다르게 보일 때가 많다.", "사진 기자는 거리를 스튜디오처럼 쓰고, 자연의 햇빛을 조명으로 쓸 때가 많다. 그래서 사진 기자에게는 타이밍이 아주 중요하다."], ["빛이 가장 아름답고 인상적인 효과를 내는 시간대가 있다. 이 시간을 매직 아워라고 부른다.", "해가 뜨고 질 때(일출·일몰) 앞뒤로 30분에서 60분쯤 되는 짧은 시간이다.", "무엇을 찍든 멋있게 보이게 하는 마법 같은 힘이 있어서 '매직(마법) 아워'라고 부르는 게 아닐까 하고 필자는 짐작한다.", "취미로 사진을 찍는 사람들도 잘 아는 매직 아워지만, 필자는 그 힘을 제대로 느끼고 쓰게 되기까지 꽤 오랜 시간이 걸렸다."], ["필자가 한국의 신문사에서 사진 기자를 처음 시작했을 때, 부러워한 사진은 주로 외국 언론사(외신)의 사진이었다.", "외신 사진은 필자의 사진보다 훨씬 깊이(입체감)가 있고, 밝은 곳에서 어두운 곳까지 농도 단계(계조)가 풍부하고, 강렬했기 때문이다.", "지금 일하는 외신에서 일하자는 제안이 왔을 때 필자가 바로 받아들인 이유 중 하나가 사실 이것이었다.", "외신 사진처럼 색이 화려하고 풍부한(다채로운) 사진을 찍고 싶었기 때문이다."], ["필자는 예전이나 지금이나 눈으로 보기에 완성도 높은 사진을 찍고 싶어 한다. 사진 기자는 서로 다른 두 영역에 두 발을 하나씩 딛고 서 있다고 생각하기 때문이다.", "하나는 뉴스를 언제나 공정하고 정확하게 전하는 저널리즘의 영역이다. 다른 하나는 때로는 강렬하고 때로는 아름다운 사진을 찍어야 하는 사진 미학(아름다움)의 영역이다.", "사진이 강렬하고 아름다우면, 사진이 전하려는 내용에 더 많은 사람이 관심을 가진다. 그래서 필자는 아름다움에서도 완성도 있는 사진을 찍으려고 한다.", "어느 한쪽으로 기울지 않고 두 발을 양쪽에 고르게(균형 있게) 딛고 서 있는 것, 그것이 이상적인 보도 사진이라고 필자는 생각한다."], ["필자는 기대에 부풀어 외신에서 일을 시작했다. 하지만 안타깝게도 하루아침에 멋진 사진을 찍지는 못했다.", "회사를 옮긴 뒤 찍는 각도(앵글)도, 화면에 담는 범위(프레임)도 많이 바꿔 봤다. 하지만 늘 마음에 들지 않았고(성에 차지 않았고), 두 발은 균형을 잡지 못했다.", "'왜 내 사진은 같은 회사 다른 나라 사무소(지국) 기자들의 사진처럼 색감이 풍부하지 않고 깊은 인상을 주지 못할까?' 이 의문은 잘 풀리지 않았다. 그러다 한두 번 비슷한 경험을 겪으면서 자연스럽게 답을 찾게 되었다.", "이제 그 경험 가운데 하나를 이야기한다."], ["2004년 12월 26일, 인도양에서 거대한 지진 해일(쓰나미)이 일어났다.", "이 지진 해일로 스리랑카, 몰디브, 태국, 인도, 인도네시아 등에서 큰 피해가 났고, 전 세계에서 28만 명이 넘는 사람이 목숨을 잃었다.", "필자는 피해가 가장 심한 인도네시아의 반다아체 지방으로 급히 보내졌다(급파되었다).", "사진 기자가 된 뒤 처음 겪는 끔찍한(참혹한) 자연재해 현장이었다.", "여러 나라의 지국에서 유명한 사진 기자 선배들이 와서, 많은 것을 배울 기회이기도 했다.", "그때 필자는 아시아 여러 지국 가운데서도 가장 어린 사진 기자였다. 그래서 국제 뉴스 현장을 많이 겪어 온 경험 많은(베테랑) 사진 기자들이 일하는 모습을 곁에서 지켜볼 수 있었다."], ["현지 주민의 집에 잠시 차린 기지(베이스캠프)에서 첫 아침을 맞았다.", "처음 가 보는 재난 뉴스 해외 출장이라, 필자는 뭔가를 보여 주고 싶은 마음(의욕)이 가득했다. 그래서 아침을 든든히 먹고, 평소처럼 일을 시작하는 오전 9시가 되면 현장에 나가려고 준비하고 있었다.", "그런데 아침 먹는 시간에도, 9시가 다 되어 가는데도 다른 사진 기자들은 보이지 않았다."], ["필자가 '선배들이 피곤해서 자고 있나, 어디 갔나' 생각하고 있을 때, 선배들이 하나둘 들어왔다.", "선배들은 이미 새벽에 나가서 취재를 하고 돌아온 것이었다.", "선배들이 노트북을 펴고 사진을 고르고 다듬는(편집하는) 것을 뒤에서 보니, 필자가 그토록 찍고 싶던 사진들이 거기에 있었다.", "선배들은 매직 아워에 맞춰 아침 일찍 취재를 시작했다. 매직 아워가 지난 뒤에도, 이른 아침 해가 낮은 각도에서 대상을 비춰 사진을 입체적으로 보이게 해 주는 때를 놓치지 않았다.", "선배 기자들은 오후 3시가 되자 다시 현장으로 나갔다.", "해가 조금씩 지기 시작하면서 햇빛이 긴 그림자를 만들기 시작하는 오후 4시부터 해 질 무렵 매직 아워까지 사진을 찍으려고, 미리 현장에 나가는 것이었다."], ["하루 동안 베테랑 사진 기자들이 일하는 방식을 옆에서 슬쩍(곁눈질로) 보고 나니, 필자는 자기 문제가 무엇인지 알 수 있었다.", "사진에서 가장 중요한 것은 빛이다. 그런데 필자는 좋은 빛을 잡기(포착하기) 위한 고민을 하지 않았던 것이다.", "한국에서는 특별한 취재가 없으면 9시에 일을 시작해서 오후 4시면 마감을 끝내고, 6시면 집에 갈 준비를 했다. 이렇게 일해 왔으니 매직 아워를 매일 놓치고 있었던 것이다.", "그동안 필자는 해가 하늘 한가운데(중천) 뜬 뒤의 가장 평범하고 재미없는 빛으로 사진을 찍어 왔던 것이다.", "빛이 가장 아름다운 때를 놓치고 있었으니, 원하는 사진을 찍을 기회를 매일매일 놓친 셈이다."], ["그날부터 필자의 사진은 달라지기 시작했다.", "필자는 매직 아워, 그리고 해가 낮게 떠서 대상에 힘찬(역동적인) 빛과 그림자를 선물해 주는(선사하는) 이른 오전과 늦은 오후를 적극적으로 쓰게 되었다.", "그때부터는 뉴스를 쫓아다니며 눈에 보이는 대로 셔터만 누르지 않았다. 보여 주고 싶은 뉴스를 어떻게 하면 더 강렬하게 보여 줄지 고민하면서, 빛을 잘 쓰는 방법을 진지하게 찾게 되었다."], ["사진 속 빛을 새로 알게 되면서(빛에 눈을 뜨면서) 필자가 또 하나 알게 된 것은 준비와 계획이 중요하다는 것이었다.", "매직 아워의 빛과 색은 겨우 몇 분 만에도 크게(변화무쌍하게) 바뀐다. 그것을 잡으려면 늘 계획을 세워 두고 준비해야 한다.", "카메라에 무엇을 담고 싶은지 미리 생각해 두지 않으면, 허둥지둥하다가 때를 놓치기 쉽다(십상이다).", "그날 매직 아워가 언제인지 알아보고, 적어도 30분 전에는 그 장소에 가서 기다려야 한다.", "'준비된 사람만 성공의 기회를 잡는다'는 격언처럼, 준비하고 계획을 짜야 좋은 사진도 찍을 수 있다는 것을 필자는 깨달았다."], ["여기까지 쓰고 보니, 이 글이 \"인생은 타이밍이 중요하고 준비된 사람만 기회를 잡으니 늘 준비하고 열심히 살아라!\" 같은 이야기처럼 보이기도 한다.", "그렇다면 좋은 인생을 살기 위한 타이밍은, 열심히 공부하고 미리미리 준비해야만 잡을 수 있고, 한번 놓치면 거의 다시 오지 않는 아주 드문(희귀한) 순간일까?"], ["사진의 대가가 한 이야기를 들어 보면, 꼭 그렇지는 않은 것 같다.", "20세기 사진 예술의 대가로 꼽히는 프랑스 사진작가 앙리 카르티에 브레송의 예술은 '결정적 순간'이라는 말로 정리된다(규정된다).", "그의 사진에 대한 생각(사진 철학)은 그동안 찍은 사진을 모은 사진집 『결정적 순간』이 1952년에 나오면서 세상에 알려졌다.", "그 뒤 '결정적 순간'은 전 세계 수많은 사진가의 마음을 사로잡은 위대한 이야기(담론)가 되었다.", "이 담론은, 화면 속 모든 것이 완벽하게 어울리는(조화를 이루는) 결정적인 순간에 셔터를 눌러 그 순간의 가장 중요한 알맹이(정수)를 잡아낸다는 뜻을 담고 있다."], ["대표적인 예는 1932년 파리의 생 라자르 역 뒤쪽 공사장에서 찍은 사진이다.", "브레송이 활동 초기에 찍은 대표작인 이 사진은 '물웅덩이 사진'이라고도 불린다.", "웅덩이 위를 펄쩍 뛰어 지나가는 한 남자를 찍은, 얼핏 보면 평범한 사진이다.", "하지만 천천히 사진을 맛보듯(음미하며) 들여다보자.", "웅덩이를 뛰어넘는 남자의 발이 물에 닿기 바로 전 순간이 보여 주는 힘찬 움직임(역동감)이 눈길을 끈다.", "동시에 단단하게 짜인 화면은 힘찬 움직임 속에서도 안정된 느낌을 준다. 지저분한 공사장과 회색 도시 풍경은 흑백 사진으로 단순해졌다. 물웅덩이에 비친 화면에서는 선과 원과 도형이 반듯하게(기하학적으로) 완성된 모양을 이룬다."], ["남자의 모습은 화면 뒤쪽에 보이는 서커스단 포스터 속 댄서와 재미있게 맞대어 보인다(대비를 이룬다).", "순간을 영원히 남는 이미지로 만드는 사진의 성질(속성), 완벽한 화면 배치(구도), 그리고 타이밍을 잡아낸 사진가의 능력. 이 셋이 만나 지저분한 도시 풍경이 반듯하고 완벽한 예술 사진이 되었다.", "여기서 우리는 평범한 일상 풍경을 아름다운 예술 사진으로 바꾸는 힘을 느낄 수 있다.", "이 힘은 순간의 타이밍을 잡아내서(포착해서) 만들어 낸 힘이기도 하다."], ["브레송 이후 50년이 넘도록 수많은 사진가가 결정적 순간을 경험해 보려고 끊임없이(부단히) 셔터를 눌렀다. 하지만 그들이 모두 '결정적 순간'을 제대로 이해한 것 같지는 않다.", "대부분은 셔터를 누를 때를 잘 짐작해서(가늠해서) 최고의 순간을 잡아야 한다고 생각했기 때문이다.", "마치 한번 놓치면 다시 오지 않는 인생의 기회처럼 말이다.", "그래서 찍은 사진을 보고, 타이밍을 제대로 못 맞춰 놓쳐 버린 순간을 아까워하며 한숨(탄식)을 쉬는 사진가가 참 많다.", "필자도 그런 사진가 가운데 한 명이었다."], ["하지만 브레송이 말한 결정적 순간은 '셔터를 누르는 한순간의 기회' 같은 단순한 뜻이 아니었다.", "브레송에게 사진이란 찍는 대상(피사체)과 함께 숨 쉬는(호흡하는) 것이었고, 실제로 있는 세상의 흐름(리듬)을 이해하는 것이었다.", "즉 그가 세운(정립한) 결정적 순간은 번쩍이는 빛(섬광)처럼 갑자기(홀연히) 눈앞에 나타나는 짧은 순간이 아니다. 세상에 대한 이해를 바탕으로 한 장의 사진이 나오는(도출되는) 때에 셔터를 눌러 기록한 순간이다.", "브레송이 선문답처럼 알쏭달쏭하게 풀어 놓은 결정적 순간은, '내가 아는 만큼 세상이 보이고, 내가 이해하는 세상 속에 결정적 순간이 있다'는 이야기인 것 같다고 필자는 해석한다."], ["브레송이 인생 마지막 무렵(말년)의 인터뷰에서 더 분명하게 이야기한 것이 있다.", "자기도 도대체 어떻게 결정적인 순간을 사진으로 잡는지 잘 모르겠고, 그 과정은 수수께끼라고 털어놓은(고백한) 것이다.", "그래서 사진에 대해서도, 결정적 순간에 대해서도 평생 누구에게도 가르치려 하지 않았다고 말했다.", "하지만 분명히 알 수 있는 것이 있다. 결정적 순간은 준비하고 기다리는 사람에게 찾아온다는 것이다.", "반듯하게 완성된 사진 틀(프레임)을 미리 만들어 놓고, 찍을 대상에 집중하며 기다리다가 셔터를 누르면 결정적 순간이 잡힌다는 것이다."], ["그리고 브레송은 아주 중요한 이야기를 덧붙였다.", "사진을 잘못 찍었다면, 그림 그릴 때 지우개로 스케치를 쓱쓱 지우고 다시 그리는 것처럼 사진도 다시 찍으면 된다는 것이다.", "그가 말한 결정적 순간은 별똥별처럼 잠깐 눈앞에 나타났다가 사라지는 것이 아니었다.", "놓치면 다시 셔터를 눌러 잡을 수 있는 것이었다.", "매일 해가 뜨고, 날마다 매직 아워가 다시 돌아오는 것처럼 말이다.", "결정적 순간을 한번 놓쳐도 셔터를 또 누르면 잡을 수 있는 것처럼, 우리 주변에는 결정적 순간이 아주 많다(숱하다).", "단, 눈앞에서 벌어지는 일이 무엇인지 정확히 이해할 수 있다면 그렇다."], ["필자의 아들은 대학 입시를 준비하면서 여러 사람에게 '공부에도 때가 있다'는 말을 들었다. 그래서 진로를 고민하는 데다, 인생의 중요한 타이밍을 놓치고 잘못된 선택을 할까 봐 걱정하고 있었다.", "필자는 아들에게 이렇게 말해 주었다."], ["\"인생에서 타이밍이 중요하다는 말은 맞는 것 같아. 그런데 그 타이밍은 참 많이 찾아오더라.", "오늘 새벽 매직 아워를 놓쳤더라도 걱정할 필요는 없어.", "저녁 해 질 무렵에 매직 아워를 다시 볼 수 있고, 내일도 해는 뜨고 또 질 테니까.", "인생의 때를 놓쳤다고 마음 졸이지(초조해하지) 마라.", "결정적 순간을 놓쳤다면 다시 한번 셔터를 누르면 된단다.\""]];
const CUT={"1-1": "열심히 공부해야 할 때, / 열심히 일해야 할 때, / 연애와 결혼을 해야 할 때가 / 있다고 하지요.", "1-2": "‘모든 일에는 다 때가 있다.’라는 말에 / 쉽게 반박하지 못하는 이유는 / 최적의 때를 잘 찾아야 / 성공할 가능성이 높아진다는 데 / 수긍하기 때문인지도 모르지요.", "2-2": "빛의 방향과 강약 / 그리고 빛이 만들어 주는 색감에 따라서 / 똑같은 피사체도 / 다르게 보일 때가 많습니다.", "2-3": "거리를 스튜디오 삼아 / 자연의 태양광을 조명으로 이용하는 일이 많은 / 사진 기자에게는 / 타이밍이 매우 중요합니다.", "3-0": "가장 아름답고 인상적인 효과를 만들어 주는 / 빛의 시간대가 있는데 / 이를 매직 아워(magic hour)라고 부릅니다.", "3-2": "뭘 찍든 멋있게 보이는 / 마법 같은 힘을 지녔기에 / 매직 아워라고 부르지 않을까 / 짐작해 봅니다.", "3-3": "취미 사진가도 잘 알고 있는 / 이 매직 아워의 힘을 / 제대로 느끼고 사용하게 되기까지는 / 제법 긴 시간이 걸렸답니다.", "4-0": "한국의 신문사에서 사진 기자를 시작할 무렵 / 제가 부러워한 사진은 / 주로 외신 사진이었습니다.", "4-1": "제가 찍은 사진보다 / 훨씬 입체감 있고 / 다양한 계조가 살아 있으며 / 강렬함이 있었거든요.", "4-2": "지금 일하고 있는 외신으로부터 / 일자리 제안을 받았을 때 / 덥석 받아들인 이유 중 하나가 / 사실 여기에 있습니다.", "5-0": "그때나 지금이나 / 시각적으로 완성도 높은 사진을 찍고 싶은 이유는, / 사진 기자는 두 가지 다른 영역에 / 두 발을 딛고 있다고 생각하기 때문입니다.", "5-1": "하나는 / 언제나 공정하고 정확하게 뉴스를 전달하는 / 저널리즘의 영역, / 다른 하나는 / 때로는 강렬하고 때로는 아름다운 사진을 찍어야 하는 / 사진 미학의 영역입니다.", "5-2": "사진이 강렬하고 아름다울 때 / 사진이 전달하고자 하는 내용에 / 더 많은 사람이 관심을 기울이기에, / 미학적으로 완성도 있는 사진을 / 촬영하려는 것입니다.", "5-3": "한쪽으로 치우침이 없이 / 두 발을 양쪽에 균형 있게 딛고 서 있는 것이 / 이상적인 보도 사진이라고 생각합니다.", "6-0": "부푼 마음으로 외신에서 일하기 시작했지만 / 안타깝게도 / 하루아침에 멋들어진 사진을 / 찍지는 못했습니다.", "6-1": "회사를 옮기고서 / 앵글도 프레임도 많이 바꾸어 봤지만 / 언제나 성에 차지 않았고 / 두 발은 균형을 잡지 못했답니다.", "6-2": "왜 내 사진은 / 같은 회사의 다른 나라 지국에서 일하는 사진 기자들의 사진처럼 / 색감이 다채롭지 않고 / 시각적으로 깊은 인상을 주지 못할까, / 하는 의문은 풀리지 않았지만 / 한두 차례의 비슷한 경험을 겪고 / 자연스럽게 그 해답을 찾아내게 되었습니다.", "7-1": "이 지진 해일로 / 스리랑카, 몰디브, 태국, 인도, 인도네시아 등에서 / 거대한 피해가 발생했고 / 전 세계에서 28만 명 이상이 사망했습니다.", "7-4": "여러 외국 지국에서 / 유명한 사진 기자 선배들이 오기에 / 많은 것을 배울 기회이기도 했습니다.", "7-5": "당시 여러 아시아 지국에서도 / 가장 어린 사진 기자였던 저는 / 많은 국제 뉴스의 현장에서 다양한 경험을 해 온 / 베테랑 사진 기자들이 일하는 모습을 / 곁에서 지켜볼 수 있었지요.", "8-1": "처음 경험하는 재난 뉴스의 해외 출장에서 / 뭔가를 보여 주고 싶은 의욕으로 가득해서 / 아침을 든든히 챙겨 먹고 / 평소 업무를 시작하는 오전 9시가 되면 / 현장으로 나갈 준비를 하고 있었습니다.", "8-2": "그런데 아침 식사 시간에도, / 9시가 다 되어 가는데도 / 다른 사진 기자는 보이지 않았습니다.", "9-0": "피곤해서 자고 있나, / 어디 갔나 생각하는 중에 / 사진 기자 선배들이 / 하나둘 들어왔습니다.", "9-2": "그리고 노트북을 펼쳐 편집하는 사진들을 /* 진행 띠: 사건(1~3) → 전반전(4~8) → 후반전(9~15) → 마지막 반격(16~18) */
const BAND=['도입: 사진에도 때가 있다','전반전: 매직 아워를 깨닫다','후반전: 결정적 순간 다시 보기','결말: 인생의 타이밍'],BG=k=>k<4?0:k<13?1:k<21?2:3;
const $=id=>document.getElementById(id);
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
let k=0,i=0,t=1,st={},auto=false,raf=0,timer=0,full=false,Q={},mode='main',doneAtEnd=true;
const done=new Set(),cutOpen=new Set();
const S=()=>mode==='ex'?SC[k].ex:SC[k];
const pFn=j=>i>j?1:i<j?0:t;
const last=()=>S().steps.length-1;
/* 엔진의 문장 나누기 = 스토리보드 ①②… 번호 (18문단 모두 일치 확인) */
const SENT=SENTS;   /* 3-2: 'St.'·따옴표 속 '!' 때문에 엔진 규칙 대신 스토리보드의 문장 나눔을 그대로 씀 */
const CIRC='①②③④⑤⑥⑦⑧⑨⑩';
const TAG='이해를 돕는 그림 · 실제 사진·장면 아님',TAGX='원문에 없는 예 · 이해를 돕는 새 예시';

function initDefs(){let d='';
  for(const n in MK)d+=`<marker id="m-${n}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${MK[n]}"/></marker>`;
  $('defs').innerHTML=d;
  let s='';for(let x=20;x<800;x+=40)for(let y=20;y<330;y+=40)s+=`<circle cx="${x}" cy="${y}" r="1" fill="#cfd8ff" opacity=".12"/>`;
  $('stars').innerHTML=s;}

/* 가장 작은 무대 글자(14)가 화면에서 13px 이상 되게. 1.5배를 넘으면(세로 태블릿·휴대폰) 작은 이름표를 숨긴다 */
function calcFS(){const w=$('svg').getBoundingClientRect().width||800;FS=Math.min(2.3,Math.max(1,13/(14*w/800)));SM=FS>1.5;}
const WHO={m:'사람들',a:'브레송',w:'필자',q:'인용',p:'등장인물'};
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);}
/* 좁은 화면: 무대에 남은 마지막 말풍선의 문장을 무대 아래 HTML 줄로 옮긴다 */
function render(){$('layer').innerHTML=S().draw(pFn,st,i);const g=SM&&[...$('layer').querySelectorAll('[data-say]')].pop(),sy=$('say');
  if(g){const [w,s]=g.dataset.say.split('|');sy.className='say-'+w;sy.innerHTML=`<b>${WHO[w]}</b><span>${esc(s)}</span>`;sy.hidden=false;}else sy.hidden=true;
  board.draw();}

function srcHTML(){if(mode==='ex')return `새 예시는 시험에 나오지 않아요. 원문은 ${k+1}문단이에요.`;
  const ss=SENT[k],cur=new Set(S().steps[i].s||[]);
  if(full)return ss.map((x,j)=>cur.has(j+1)?`<mark>${esc(x)}</mark>`:esc(x)).join(' ');
  return ss.filter((_,j)=>cur.has(j+1)).map(esc).join(' ');}
function ezHTML(){
  if(mode==='ex')return '<table class="map">'+S().map.map(([a,b],j)=>`<tr data-a="mp${j}"><td>${a}</td><td>↔</td><td>${b}</td></tr>`).join('')+'</table>';
  return (S().steps[i].s||[]).map((n,j)=>{const key=k+'-'+(n-1),c=CUT[key],open=cutOpen.has(key);
    return `<div class="es"><p data-a="ez${j}"><b>${CIRC[n-1]}</b>${esc(EZ[k][n-1])}</p>`+(c?`<button class="link cut" type="button" data-cut="${key}" aria-expanded="${open}">${open?'끊어 읽기 닫기':'끊어 읽기'}</button>`+(open?`<span class="cutt" data-a="ezc${j}">${esc(c)}</span>`:''):'')+'</div>';}).join('');}

function ui(){const s=S(),stp=s.steps[i],L1=last(),playing=t<1,ex=mode==='ex';
  $('count').textContent=String(k+1).padStart(2,'0')+' / '+N;
  $('band').innerHTML=BAND.map((b,j)=>`<span class="${j===BG(k)?'on':j<BG(k)?'past':''}">${b}</span>`).join('<i>→</i>');
  $('eyebrow').textContent=ex?`${k+1}문단 · 새 예시 · 원문에 없는 예`:`${k+1}문단 · ${SC[k].role}`;$('q').textContent=s.q;
  $('cap').textContent=stp.cap;
  const n=$('note');n.textContent=st.note||'';n.className=st.noteBad?'bad':st.note?'good':'';
  $('dots').innerHTML=s.steps.map((_,j)=>`<i class="${j===i?'now':j<i?'on':''}"></i>`).join('');
  const c=$('controls');let h='';
  if(stp.ch&&!playing&&i<L1){h+=`<p class="ask" data-a="ask">${stp.ch.q}</p>`+stp.ch.o.map((o,j)=>`<button class="btn choice" type="button" data-ch="${j}" data-a="ch${j}">${o.t}</button>`).join('');}
  else if(i<L1){const nb=s.steps[i+1].btn||(i===0?'해 보기':'다음 단계');h+=`<button class="btn primary" type="button" id="bNext"><span>${playing?'바로 보기':nb} ▶</span><small>${i+1} / ${L1}단계</small></button>`;}
  else if(!playing&&!ex&&SC[k].ex)h+=`<button class="btn ex" type="button" id="bEx">새 예시로 보기 ▸ <small>원문에 없는 예로 한 번 더</small></button>`;
  c.innerHTML=h;c.hidden=!h;
  $('tools').innerHTML=(ex?`<button class="btn" type="button" id="bBack">◂ 지문으로 돌아가기</button>`:'')+`<button class="btn" type="button" id="bAuto"${auto?' aria-pressed="true"':''}>${auto?'자동 재생 멈춤':'자동으로 보기'}</button><button class="btn" type="button" id="bPrev"${i===0?' disabled':''}>이전 단계</button><button class="btn" type="button" id="bReset">다시 보기</button>`;
  c.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{auto=false;pick(stp.ch.o[+b.dataset.ch]);});
  if($('bNext'))$('bNext').onclick=()=>{if(t<1){t=1;cancelAnimationFrame(raf);fin(false);}else step();};
  if($('bEx'))$('bEx').onclick=enterEx;if($('bBack'))$('bBack').onclick=exitEx;
  $('bAuto').onclick=toggleAuto;$('bPrev').onclick=prev;$('bReset').onclick=reset;
  const showFinal=(i===L1&&t>=1)||Q.ok;
  $('final').hidden=!showFinal;$('quizBox').hidden=!showFinal;$('nextP').classList.toggle('primary',showFinal&&k<N-1&&!ex);$('finalT').textContent=s.final;$('finalN').textContent='다음 · '+s.next;
  $('src').innerHTML=srcHTML();$('full').hidden=ex;$('full').textContent=full?'이 단계의 문장만 보기':'문단 전체 읽기';
  $('ezH').textContent=ex?'지문과 이어 보기':'쉬운 문장';$('ez').innerHTML=ezHTML();
  $('ez').querySelectorAll('[data-cut]').forEach(b=>b.onclick=()=>{const key=b.dataset.cut;cutOpen.has(key)?cutOpen.delete(key):cutOpen.add(key);ui();});
  $('hint').textContent=k<N-1?`다음 문단: ${SC[k+1].q}`:'마지막 문단이에요.';
  $('prevP').disabled=k===0;$('nextP').disabled=k===N-1;
  board.draw();sync.changed();}

function quiz(){const z=S().quiz,box=$('qopts'),pk=$('picked');$('qq').textContent=z.q;
  const fb=$('qfb');fb.textContent=Q.msg||'';fb.className='fb '+(Q.msg?(Q.ok?'good':'bad'):'');
  pk.hidden=true;
  box.innerHTML=z.o.map((o,j)=>`<button type="button" data-o="${j}" data-a="qo${j}" class="${Q.sel===j?(o.ok?'right':'wrong'):''}">${o.t}</button>`).join('');
  box.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const j=+b.dataset.o,o=z.o[j];Q.sel=j;Q.ok=!!o.ok;Q.msg=o.fb;if(o.ok&&mode==='main'){done.add(k);nav();}quiz();ui();});}

function nav(){$('nav').innerHTML=SC.map((s,j)=>`<li><button type="button" data-k="${j}"${j===k?' aria-current="true"':''} class="${done.has(j)?'done':''}"><span class="n">${String(j+1).padStart(2,'0')}</span><span>${s.nav}</span></button></li>`).join('');
  $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>load(+b.dataset.k));
  const cur=$('nav').querySelector('[aria-current]'),bar=$('nav').parentElement;
  if(cur&&innerWidth<=1120){const a=cur.getBoundingClientRect(),b=bar.getBoundingClientRect();bar.scrollLeft+=(a.left+a.width/2)-(b.left+b.width/2);}}

function stopAll(){cancelAnimationFrame(raf);clearTimeout(timer);}
function setMode(m){mode=m;$('stage').classList.toggle('ex',m==='ex');$('tag').textContent=m==='ex'?TAGX:TAG;}
function load(n){stopAll();k=n;i=0;t=1;st={};auto=false;full=false;Q={msg:'',ok:false,sel:null};setMode('main');board.clear(true);
  const s=SC[k];$('role').textContent=s.role;$('goal').textContent=s.goal;
  $('easyBox').hidden=!s.easy;$('easy').innerHTML=s.easy||'';
  nav();render();ui();quiz();
  try{localStorage.setItem('photo32-k',String(k));}catch(e){}
  try{history.replaceState(null,'','#p'+(k+1));}catch(e){}}
/* 새 예시 모드: 같은 엔진으로 SC[k].ex의 단계·그림·확인 질문을 잠시 대신 그린다 */
function enterEx(){stopAll();setMode('ex');i=0;t=1;st={};auto=false;Q={msg:'',ok:false,sel:null};render();ui();quiz();}
function exitEx(){stopAll();setMode('main');i=last();t=1;st={};auto=false;Q={msg:'',ok:false,sel:null};render();ui();quiz();}
function step(){if(i>=last())return;i++;t=0;st.note='';st.noteBad=false;run();}
function run(){stopAll();const d=(S().steps[i].d||2.5)*1000;
  if(rm){t=1;render();fin();return;}
  let t0=null;const f=now=>{if(t0===null)t0=now;t=cl((now-t0)/d);render();if(t<1)raf=requestAnimationFrame(f);else fin();};
  raf=requestAnimationFrame(f);ui();}
function fin(){render();if(doneAtEnd&&i===last()&&mode==='main'){done.add(k);nav();}ui();
  if(auto){if(i<last()){timer=setTimeout(()=>{const ch=S().steps[i].ch;if(ch)pick(ch.o.find(o=>o.ok!==false));else step();},1200);}else{auto=false;ui();}}}
function pick(o){const ch=S().steps[i].ch;
  if(o.ok===false){st.wrong=o.v;st.note=o.fb;st.noteBad=true;render();ui();return;}
  st[ch.key]=o.v;st.wrong=null;const fb=o.fb||'';step();st.note=fb;st.noteBad=false;ui();}
function prev(){if(i===0)return;stopAll();auto=false;i--;t=1;st.note='';st.noteBad=false;st.wrong=null;render();ui();}
function reset(){stopAll();auto=false;i=0;t=1;st={};render();ui();}
function toggleAuto(){if(auto){auto=false;stopAll();if(t<1){t=1;render();}ui();return;}
  auto=true;if(i===last()){i=0;t=1;st={};render();}
  const ch=S().steps[i].ch;if(ch)pick(ch.o.find(o=>o.ok!==false));else step();}

$('full').onclick=()=>{full=!full;ui();};
['srcBox','easyBox'].forEach(id=>$(id).addEventListener('toggle',()=>{board.draw();sync.changed();}));
$('prevP').onclick=()=>k>0&&load(k-1);$('nextP').onclick=()=>k<N-1&&load(k+1);
if(innerWidth<=760){$('srcBox').open=false;}
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{const f=FS;calcFS();if(f!==FS)render();},150);});
/* ---------- 칠판 선을 '무엇 위에 그렸는지'로 저장 ----------
   무대 위 = 무대 너비 비율(n) · 글자 위 = 가장 가까운 글자 한 자 기준(c, 글자 크기 단위) · 그 밖 = 그 칸 왼쪽 위 기준(b).
   그래서 학생 화면 크기·줄바꿈이 달라도 같은 그림·같은 글자 위에 다시 그려진다.
   글자·칸 기준 선은 그 칸 글이 그릴 때와 같을 때만 보인다(단계가 바뀌어 글이 바뀌면 숨었다가 돌아오면 다시 보임). */
const A=(()=>{
  const BIG=new Set(['top','app','main','aside','body']);
  const hash=s=>{let h=0;for(let j=0;j<s.length;j++)h=(h*31+s.charCodeAt(j))|0;return (h>>>0).toString(36);};
  const el=id=>id==='body'?document.body:document.querySelector(`[data-a="${id}"]`);
  const texts=e=>{const w=document.createTreeWalker(e,NodeFilter.SHOW_TEXT),a=[];let n;while((n=w.nextNode()))a.push(n);return a;};
  function box(e,ci){for(const n of texts(e)){if(ci<n.length){const r=document.createRange();r.setStart(n,ci);r.setEnd(n,ci+1);const b=r.getClientRects()[0];
      return b&&b.height?{x:b.left+scrollX,y:b.top+scrollY,u:(parseFloat(getComputedStyle(n.parentElement).fontSize)||16)/100}:null;}ci-=n.length;}return null;}
  function caret(x,y){if(document.caretPositionFromPoint){const c=document.caretPositionFromPoint(x,y);return c&&[c.offsetNode,c.offset];}
    if(document.caretRangeFromPoint){const r=document.caretRangeFromPoint(x,y);return r&&[r.startContainer,r.startOffset];}return null;}
  const map=(pts,f)=>pts.flatMap(([x,y])=>f(x,y).map(Math.round));
  function pin(pts){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const [x,y] of pts){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}
    const cx=(x0+x1)/2-scrollX,cy=(y0+y1)/2-scrollY,g=$('stage').getBoundingClientRect();
    if(cx>=g.left&&cx<=g.right&&cy>=g.top&&cy<=g.bottom){const L=g.left+scrollX,T=g.top+scrollY,W=g.width/1e4;return {m:'n',a:'stage',p:map(pts,(x,y)=>[(x-L)/W,(y-T)/W])};}
    const c=caret(cx,cy),h=c&&c[0]&&c[0].nodeType===3&&c[0].parentElement.closest('[data-a]');
    if(h&&!BIG.has(h.dataset.a)){const tx=h.textContent;let ci=0;for(const n of texts(h)){if(n===c[0]){ci+=Math.min(c[1],n.length-1);break;}ci+=n.length;}
      if(/\s/.test(tx[ci]||' '))for(let d=1;d<6;d++){if(tx[ci+d]&&!/\s/.test(tx[ci+d])){ci+=d;break;}if(ci-d>=0&&!/\s/.test(tx[ci-d])){ci-=d;break;}}
      const b=box(h,ci);if(b)return {m:'c',a:h.dataset.a,h:hash(tx),i:ci,p:map(pts,(x,y)=>[(x-b.x)/b.u,(y-b.y)/b.u])};}
    const e=document.elementsFromPoint(cx,cy).map(x=>x.closest('[data-a]')).find(Boolean)||document.body,id=e===document.body?'body':e.dataset.a,r=e.getBoundingClientRect(),L=r.left+scrollX,T=r.top+scrollY;
    return {m:'b',a:id,h:BIG.has(id)?'':hash(e.textContent),p:map(pts,(x,y)=>[(x-L)*2,(y-T)*2])};}
  function place(s){const e=el(s.a);if(!e||(s.h&&hash(e.textContent)!==s.h))return null;let f;
    if(s.m==='c'){const b=box(e,s.i);if(!b)return null;f=(x,y)=>[b.x+x*b.u,b.y+y*b.u];}
    else{const r=e.getBoundingClientRect();if(!r.width)return null;const L=r.left+scrollX,T=r.top+scrollY,W=s.m==='n'?r.width/1e4:.5;f=(x,y)=>[L+x*W,T+y*W];}
    const out=[];for(let j=0;j+1<s.p.length;j+=2)out.push(f(s.p[j],s.p[j+1]));return out;}
  return {pin,place};})();

/* ---------- 칠판: 페이지 위에 덧그리기 ----------
   지문 데이터는 바꾸지 않는다. 혼자 볼 때 선은 메모리에만 있고, 수업 연결 중에는 학생 화면으로 보내려고 수업 기록(live/ink)에만 쓴다.
   문단을 옮기면 지워진다. */
const board=(()=>{const cv=$('board'),ctx=cv.getContext('2d'),bar=$('boardBar'),W={pen:3,hl:22};
  let on=false,view=false,tool='pen',col={pen:'#e5484d',hl:'#ffe14d'},strokes=[],hist=[],cur=null,dpr=1,raf=0;
  const api={hook:null},tell=d=>api.hook&&api.hook(d);
  function size(){dpr=Math.min(2,devicePixelRatio||1);cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);draw();}
  function line(s,P){ctx.globalAlpha=s.t==='hl'?.38:1;ctx.strokeStyle=s.c;ctx.lineWidth=W[s.t];ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
    P.forEach(([x,y],j)=>j?ctx.lineTo(x,y):ctx.moveTo(x,y));if(P.length===1)ctx.lineTo(P[0][0]+.1,P[0][1]);ctx.stroke();}
  function draw(){if(!on)return;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.setTransform(dpr,0,0,dpr,-scrollX*dpr,-scrollY*dpr);
    for(const s of strokes){const P=A.place(s);if(P)line(s,P);}if(cur&&cur.raw)line(cur,cur.raw);ctx.globalAlpha=1;}
  const pt=e=>[e.clientX+scrollX,e.clientY+scrollY];
  /* 지우개는 닿은 선을 통째로 지운다 */
  function erase(p){const hit=strokes.filter(s=>{const P=A.place(s);return P&&P.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<14+W[s.t]/2);});
    if(hit.length){strokes=strokes.filter(s=>!hit.includes(s));hist.push({back:hit});draw();tell({del:hit.map(s=>s.id)});}}
  /* 손을 떼면 점을 줄이고(1.5px 간격) 무엇 위에 그렸는지 기준으로 바꿔 저장한다. 판·도구 막대는 잠시 비켜서 아래를 본다 */
  function finish(c){const P=[];for(const q of c.raw){const l=P[P.length-1];if(!l||Math.hypot(q[0]-l[0],q[1]-l[1])>=1.5)P.push(q);}
    const pe=cv.style.pointerEvents;cv.style.pointerEvents='none';bar.style.pointerEvents='none';
    try{return {id:Math.random().toString(36).slice(2,9),t:c.t,c:c.c,...A.pin(P)};}finally{cv.style.pointerEvents=pe;bar.style.pointerEvents='';}}
  cv.addEventListener('pointerdown',e=>{if(tool==='hand'||view)return;e.preventDefault();cv.setPointerCapture(e.pointerId);const p=pt(e);
    if(tool==='eraser'){cur={eraser:1};erase(p);return;}cur={t:tool,c:col[tool],raw:[p]};draw();});
  cv.addEventListener('pointermove',e=>{if(!cur)return;const p=pt(e);if(cur.eraser){erase(p);return;}cur.raw.push(p);draw();});
  const end=()=>{const c=cur;cur=null;if(c&&!c.eraser){const s=finish(c);strokes.push(s);hist.push({add:s});draw();tell({add:[s]});}};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  function undo(){const h=hist.pop();if(!h)return;if(h.add){strokes=strokes.filter(s=>s!==h.add);tell({del:[h.add.id]});}else{strokes=strokes.concat(h.back);tell({add:h.back});}draw();}
  function clear(reset){if(reset){strokes=[];hist=[];cur=null;draw();tell({clr:1});return;}if(strokes.length){hist.push({back:strokes});strokes=[];draw();tell({clr:1});}}
  function setTool(t){tool=t;cv.style.pointerEvents=view||t==='hand'?'none':'auto';paint();}
  function paint(){const b=$('bBoard');b.textContent=on?'칠판 끄기':'칠판 켜기';b.setAttribute('aria-pressed',on);
    bar.querySelectorAll('[data-tool]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.tool===tool));
    bar.querySelectorAll('[data-col]').forEach(x=>{const [t,c]=x.dataset.col.split('|');x.hidden=t!==tool;x.setAttribute('aria-pressed',col[t]===c);});}
  function setOn(v){on=v;document.body.classList.toggle('board-on',on);cv.hidden=!on;bar.hidden=!on||view;if(on){size();setTool(tool);}paint();}
  function toggle(){setOn(!on);tell({on:1});}
  $('bBoard').onclick=toggle;$('bBoardOff').onclick=toggle;$('bUndo').onclick=undo;$('bClear').onclick=()=>clear(false);
  bar.querySelectorAll('[data-tool]').forEach(x=>x.onclick=()=>setTool(x.dataset.tool));
  bar.querySelectorAll('[data-col]').forEach(x=>x.onclick=()=>{const [t,c]=x.dataset.col.split('|');col[t]=c;paint();});
  api.draw=()=>{if(on&&strokes.length){cancelAnimationFrame(raf);raf=requestAnimationFrame(draw);}};
  addEventListener('scroll',api.draw,{passive:true});
  addEventListener('resize',()=>{if(on)size();});
  new ResizeObserver(api.draw).observe(document.querySelector('.app'));
  if(document.fonts)document.fonts.ready.then(api.draw);
  paint();
  Object.assign(api,{clear,
    set(list){strokes=list.slice();hist=[];cur=null;draw();},  // 학생 화면: 선생님 선으로 바꾸기
    setOn(v){v=!!v;if(v!==on)setOn(v);},
    view(v){view=v;cur=null;setOn(on);}});                     // 학생 화면: 그리기·도구 막대 없음
  Object.defineProperties(api,{strokes:{get:()=>strokes},on:{get:()=>on}});
  return api;})();

/* ---------- 수업 연결 (Netlify 같은 보통 사이트 + Firebase): 선생님 화면 → 학생 화면 ----------
   페이지는 아무 정적 사이트에 올리고, 실시간 전달만 Firebase Realtime Database를 쓴다(config.js에 설정값).
   선생님: 주소 끝에 ?t 를 붙여 열고 구글로 로그인 — 규칙에 적은 메일만 수업 기록을 쓸 수 있다.
   학생: 주소만 열면 된다(눈에 안 보이는 익명 로그인). 누르기는 막고 선생님 화면을 그대로 따라 그린다.
   live/state = 지금 화면 한 장 · live/ink = 칠판 선(선 하나 = 자식 하나) · presence/<학생>/<탭> = 학생 상태(창을 닫으면 저절로 지워짐).
   Firebase가 없거나 설정 전이면 연결 없이 혼자 보기로 동작한다. */
const sync=(()=>{
  const live=$('live'),bView=$('bView'),gateEl=$('gate'),mon=$('mon'),toastEl=$('toast'),loginEl=$('login');
  const FB=window.firebase,CFG=window.FIREBASE_CONFIG||{};
  const ready=!!(FB&&CFG.apiKey&&CFG.databaseURL&&!/붙여넣기/.test(CFG.apiKey));
  const TEACH=/(^|[?&])t(=|&|$)/.test(location.search.slice(1));
  const TAB=Math.random().toString(36).slice(2,8);
  let role=ready?'wait':'solo',owner=false,preview=false,db=null,auth=null,myRef=null,
      maxRev=0,lastJ='',cur=null,seq=0,ink={k:-1,s:[]},inkSeen=false,remote=null,applied=0,applying=false,lastSc='',err='',hasState=false,hadFocus=false,online=true;
  const nextRev=()=>(maxRev=Math.max(Date.now(),maxRev+1));
  const okN=v=>Number.isInteger(v)&&v>=0;
  const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
  let fsOk=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled),seenFs=false;

  /* --- 지금 화면 한 장 --- */
  const theme=()=>document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  /* 선생님 창 맨 위에 걸친 칸과 그 칸을 얼마나 내려 봤는지(0~1000). 넓은 화면에서는 가운데 열만 본다 */
  function scAnchor(){if(scrollY<4)return 'top';const one=innerWidth<=760;
    for(const e of document.querySelectorAll('[data-s]')){if(!one&&e.closest('aside'))continue;const r=e.getBoundingClientRect();if(!r.height||r.bottom<=1)continue;
      return e.dataset.s+':'+Math.round(Math.max(0,Math.min(1,-r.top/r.height))*1000);}return 'end';}
  const snap=()=>({k,i,m:mode,p:t<1?1:0,st,f:full?1:0,c:[...cutOpen],d:[...done],q:Q.sel??null,
    o:[$('srcBox').open?1:0,$('easyBox').open?1:0],b:board.on?1:0,sc:scAnchor(),th:theme()});

  /* --- 선생님: 바뀌면 쓴다(40ms 모아서). Firebase가 순서대로 보내 준다 --- */
  let ct=0;
  function changed(){if(role!=='teacher'||applying)return;clearTimeout(ct);ct=setTimeout(commit,40);}
  const fail=e=>setErr(e&&/PERMISSION_DENIED/i.test(String(e.code||e.message))?'저장 권한이 없어요 · 규칙의 선생님 메일을 확인하세요':'저장이 잠시 안 돼요');
  function commit(){if(role!=='teacher')return;const s=snap(),j=JSON.stringify(s);if(j===lastJ)return;lastJ=j;cur={...s,rev:nextRev()};
    db.ref('photo32/live/state').set(cur).then(()=>setErr(''),fail);}
  board.hook=d=>{if(d.on){changed();return;}if(role!=='teacher'||applying)return;
    if(d.clr){ink={k,s:[]};db.ref('photo32/live/ink').set({k}).catch(fail);return;}
    const u={k};(d.del||[]).forEach(id=>{u['s/'+id]=null;});(d.add||[]).forEach(s=>{u['s/'+s.id]={...s,q:++seq};});
    db.ref('photo32/live/ink').update(u).catch(fail);};
  let sct=0;addEventListener('scroll',()=>{if(role!=='teacher')return;clearTimeout(sct);sct=setTimeout(changed,250);},{passive:true});

  /* --- 학생: 받은 상태 그대로 맞추기 (받은 값은 모양부터 확인) --- */
  const HEX=/^#[0-9a-fA-F]{6}$/,ID=/^[\w-]{1,24}$/;
  const okS=s=>!!s&&ID.test(s.id)&&(s.t==='pen'||s.t==='hl')&&HEX.test(s.c)&&['n','c','b'].includes(s.m)&&ID.test(s.a)&&Array.isArray(s.p)&&s.p.length<=6000&&s.p.every(Number.isFinite)&&(s.m!=='c'||okN(s.i));
  const valid=d=>!!d&&okN(d.k)&&d.k<N&&(d.m==='main'||(d.m==='ex'&&!!SC[d.k].ex))&&okN(d.i)&&d.i<(d.m==='ex'?SC[d.k].ex:SC[d.k]).steps.length&&okN(d.rev);
  const prim=o=>Object.fromEntries(Object.entries(o&&typeof o==='object'?o:{}).filter(([,v])=>v===null||['string','number','boolean'].includes(typeof v)));
  const strokes=m=>Object.values(m&&typeof m==='object'?m:{}).filter(okS).sort((a,b)=>(a.q||0)-(b.q||0));
  function apply(d,follow){applying=true;
    try{const same=d.k===k&&d.m===mode,oi=i;
      if(!same)lastSc='';if(d.k!==k)load(d.k);if(d.m!==mode)setMode(d.m);
      st=prim(d.st);full=!!d.f;auto=false;
      cutOpen.clear();(Array.isArray(d.c)?d.c:[]).forEach(x=>typeof x==='string'&&cutOpen.add(x));
      done.clear();(Array.isArray(d.d)?d.d:[]).forEach(x=>okN(x)&&x<N&&done.add(x));
      const o=Number.isInteger(d.q)?S().quiz.o[d.q]:null;Q=o?{sel:d.q,ok:!!o.ok,msg:o.fb}:{msg:'',ok:false,sel:null};
      const so=Array.isArray(d.o)?d.o:[1,1];$('srcBox').open=!!so[0];$('easyBox').open=!!so[1];
      if(follow&&same&&d.i===oi+1&&d.p&&!rm){i=d.i;t=0;run();}                 // 선생님이 방금 다음 단계로 → 같은 움직임
      else if(same&&d.i===oi&&t<1&&d.p)ui();                                    // 같은 움직임이 아직 도는 중
      else{stopAll();i=d.i;t=1;render();ui();}                                   // 그 밖에는 멈춘 그림으로 맞춘다
      quiz();nav();board.setOn(d.b);
      if(follow&&(d.th==='dark'||d.th==='light'))document.documentElement.dataset.theme=d.th;
    }finally{applying=false;}
    applied=d.rev;if(follow){showInk(false);follow2(d.sc);pres();}}
  function onState(d){if(!valid(d))return;maxRev=Math.max(maxRev,d.rev);hasState=true;if(!remote||d.rev>remote.rev)remote=d;
    if(role==='view'&&d.rev>applied)apply(d,true);paintLive();}
  function onInk(v){if(role==='teacher')return;const had=new Set(ink.s.map(s=>s.id));
    ink={k:v&&okN(v.k)?v.k:-1,s:strokes(v&&v.s)};showInk(ink.s.some(x=>!had.has(x.id)));}
  function showInk(fresh){if(role!=='view')return;board.set(ink.k===k?ink.s:[]);
    if(fresh&&inkSeen&&ink.k===k&&ink.s.length)reveal(ink.s[ink.s.length-1]);inkSeen=true;}
  /* 새 선이 학생 창 밖에 그려졌으면 그 선이 보이게 굴린다 (휴대폰처럼 배치가 다를 때) */
  function reveal(s){const P=A.place(s);if(!P)return;let a=1e9,b=-1e9;for(const [,y] of P){a=Math.min(a,y);b=Math.max(b,y);}
    if(a>=scrollY+48&&b<=scrollY+innerHeight-48)return;scrollTo({top:(a+b)/2-innerHeight/2,behavior:rm?'auto':'smooth'});}
  /* 선생님이 화면을 굴리면 같은 칸의 같은 곳으로 따라간다 (선생님이 안 굴리면 학생이 자유롭게 본다) */
  function follow2(sc){if(typeof sc!=='string'||sc===lastSc)return;lastSc=sc;let y=0;
    if(sc==='end')y=document.documentElement.scrollHeight;
    else if(sc!=='top'){const [id,r]=sc.split(':'),e=ID.test(id)&&document.querySelector(`[data-s="${id}"]`);if(!e)return;const b=e.getBoundingClientRect();if(!b.height)return;
      y=b.top+scrollY+b.height*Math.min(1,Math.max(0,(+r||0)/1000));}
    scrollTo({top:y,behavior:rm?'auto':'smooth'});}
  /* 학생 화면에서는 누르기를 막는다(읽기·스크롤은 됨). vok 표시가 있는 단추만 통과 */
  document.addEventListener('click',e=>{if((role==='view'||role==='wait')&&!(e.target.closest&&e.target.closest('.vok'))){e.preventDefault();e.stopImmediatePropagation();}},true);
  if(role==='wait')document.body.classList.add('view');   // 누구인지 알 때까지는 학생 화면처럼

  /* --- 학생: 전체화면 안내판 + 선생님께 알릴 내 상태 --- */
  function gate(){gateEl.hidden=!(role==='view'&&!owner&&fsOk&&!fsEl());
    document.querySelectorAll('header,.app,footer').forEach(x=>x.inert=!gateEl.hidden||!loginEl.hidden);if(gateEl.hidden)return;$('gateBtn').focus();
    $('gateT').textContent=seenFs?'전체화면이 꺼졌어요':'수업 화면은 전체화면으로 봐요';
    $('gateP').textContent=seenFs?'다시 전체화면으로 보면 수업 화면이 보여요.':'아래 버튼을 누르면 수업 화면이 전체화면으로 열려요.';}
  function noFs(){fsOk=false;gate();pres();}   // 이 기기·창이 전체화면을 막으면 안내판을 치우고 그냥 보여 준다(못 들어가게 막지 않음)
  $('gateBtn').onclick=()=>{const d=document.documentElement,f=d.requestFullscreen||d.webkitRequestFullscreen;if(!f){noFs();return;}
    try{const r=f.call(d);if(r&&r.catch)r.catch(noFs);}catch(e){noFs();}};
  ['fullscreenerror','webkitfullscreenerror'].forEach(v=>document.addEventListener(v,noFs));
  function pres(){if(!myRef||owner||role!=='view')return;if(document.hasFocus())hadFocus=true;
    myRef.set({v:1,fs:fsEl()?1:0,fsOk:fsOk?1:0,vis:document.visibilityState==='visible'?1:0,foc:!hadFocus||document.hasFocus()?1:0,r:applied}).catch(()=>{});}
  ['visibilitychange','fullscreenchange','webkitfullscreenchange'].forEach(v=>document.addEventListener(v,()=>{if(fsEl())seenFs=true;gate();pres();}));
  addEventListener('focus',pres);addEventListener('blur',pres);

  /* --- 선생님: 학생 상태 알림 --- */
  const P=new Map(),NUM=new Map(),LOG=[];let tick=0,tt=0,lastPres={};
  const dur=ms=>{const s=Math.max(0,Math.round(ms/1000));return s<60?s+'초':Math.floor(s/60)+'분 '+s%60+'초';};
  function say(m,lv){LOG.unshift([new Date().toTimeString().slice(0,8),m,lv]);LOG.length=Math.min(LOG.length,80);
    toastEl.textContent=m;toastEl.className='toast '+lv;toastEl.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toastEl.hidden=true,5000);}
  /* presence 전체가 바뀔 때마다 이전과 비교해 들어옴·바뀜·나감을 가려낸다 (학생 하나 = 기기의 익명 번호, 탭마다 따로) */
  function onPresence(v){const now={};for(const [uid,tabs] of Object.entries(v&&typeof v==='object'?v:{}))for(const [tab,p] of Object.entries(tabs&&typeof tabs==='object'?tabs:{}))if(p&&p.v===1)now[uid+'/'+tab]={by:uid,p};
    const ch={joined:[],updated:[],left:[]};
    for(const [peer,x] of Object.entries(now)){const o=lastPres[peer];if(!o)ch.joined.push({peer,by:x.by,presence:x.p});else if(JSON.stringify(o.p)!==JSON.stringify(x.p))ch.updated.push({peer,by:x.by,presence:x.p});}
    for(const peer of Object.keys(lastPres))if(!now[peer])ch.left.push({peer});
    lastPres=now;watch(ch);}
  function watch(ch){
    for(const p of [...ch.joined,...ch.updated]){const o=P.get(p.peer),n=p.presence,key=p.by;
      if(!NUM.has(key))NUM.set(key,NUM.size+1);const nm=(NUM.size>1?'학생 '+NUM.get(key):'학생')+' · ';
      if(!o){P.set(p.peer,{p:n,out:n.vis?0:Date.now(),n:NUM.get(key),by:p.by});
        say(nm+'들어왔어요 ('+(!n.fsOk?'전체화면이 안 되는 기기·창':n.fs?'전체화면':'아직 전체화면 아님')+')','info');
        if([...P.values()].filter(x=>x.by===p.by).length>1)say(nm+'이 페이지를 탭 두 개로 열었어요','warn');continue;}
      const a=o.p;
      if(a.vis&&!n.vis){o.out=Date.now();say(nm+'다른 탭이나 다른 앱으로 나갔어요','bad');}
      else if(!a.vis&&n.vis){say(nm+'돌아왔어요 · '+dur(Date.now()-o.out)+' 동안 나가 있었어요','good');o.out=0;}
      if(n.fsOk&&n.vis&&a.fs&&!n.fs)say(nm+'전체화면을 껐어요','bad');
      else if(n.fsOk&&!a.fs&&n.fs)say(nm+'전체화면으로 봐요','good');
      if(a.vis&&n.vis&&a.foc&&!n.foc)say(nm+'수업 화면 밖(다른 창)을 눌렀어요','warn');
      o.p=n;}
    for(const p of ch.left){const o=P.get(p.peer);if(o){P.delete(p.peer);say((NUM.size>1?'학생 '+o.n:'학생')+' · 나갔어요 (창을 닫았거나 연결이 끊김)','bad');}}
    paintLive();}
  function setLive(txt,cls){live.textContent=txt;live.className='live vok '+(cls||'')+(owner&&!preview?' own':'');}
  function setErr(m){if(err!==m){err=m;paintLive();}}
  function paintLive(){if(role==='solo'||role==='wait')return;
    const off=!online&&'연결이 끊겼어요 · 다시 연결하는 중';
    if(role==='view'&&!owner){setLive(off||err||(!hasState?'선생님이 아직 수업을 열지 않았어요':'선생님 화면을 따라가는 중'),off||err?'bad':hasState?'ok':'');return;}
    if(preview){setLive('학생 화면 미리보기','');return;}
    const L=[...P.values()],pre=L.length>1?`학생 ${L.length}명 · `:'학생 ';let txt,cls='';
    if(off||err){txt=off||err;cls='bad';}
    else if(!L.length)txt='수업 공유 중 · 학생 접속 전';
    else{const out=L.filter(x=>!x.p.vis);
      if(out.length){txt=pre+'다른 탭에 있음 '+dur(Date.now()-Math.min(...out.map(x=>x.out)));cls='bad';}
      else if(L.some(x=>x.p.fsOk&&!x.p.fs)){txt=pre+'전체화면 아님';cls='warn';}
      else if(L.some(x=>!x.p.foc)){txt=pre+'다른 창 선택됨';cls='warn';}
      else{txt=pre+'보는 중'+(L.every(x=>x.p.fs)?' · 전체화면':'');cls='ok';}}
    setLive(txt,cls);
    const need=L.some(x=>!x.p.vis);if(need&&!tick)tick=setInterval(paintLive,1000);if(!need&&tick){clearInterval(tick);tick=0;}
    if(!mon.hidden)paintMon();}
  function paintMon(){const L=[...P.values()],latest=cur?cur.rev:0;
    mon.innerHTML='<h2>학생 화면 상태</h2>'+(L.length?L.map(x=>{const p=x.p;return `<div class="who"><b>${L.length>1?'학생 '+x.n:'학생'}</b>`
        +(p.vis?'✓ 이 탭을 보는 중':'✗ 다른 탭·앱 ('+dur(Date.now()-x.out)+')')+'<br>'+(!p.fsOk?'– 전체화면이 안 되는 기기·창':p.fs?'✓ 전체화면':'✗ 전체화면 아님')+'<br>'
        +(p.foc?'✓ 수업 창 선택됨':'△ 다른 창 선택됨')+'<br>'+((p.r||0)>=latest?'✓ 선생님 화면과 같음':'… 따라오는 중')+'</div>';}).join('')
      :'<p class="tip">학생이 이 사이트 주소(끝에 ?t 없이)를 열면 여기에 보여요.</p>')
      +(LOG.length?'<h2>알림 기록</h2><ol>'+LOG.map(([tm,m,lv])=>`<li class="${lv}"><time>${tm}</time><span>${esc(m)}</span></li>`).join('')+'</ol>':'')
      +'<p class="tip"><button class="link vok" type="button" id="bOut">선생님 로그아웃</button></p>';
    $('bOut').onclick=()=>auth.signOut().then(()=>location.replace(location.pathname+'?t'));}
  live.onclick=()=>{if(!owner||preview)return;mon.hidden=!mon.hidden;if(!mon.hidden)paintMon();};
  document.addEventListener('pointerdown',e=>{if(!mon.hidden&&!mon.contains(e.target)&&e.target!==live)mon.hidden=true;});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')mon.hidden=true;});
  /* 선생님만: 이 탭을 학생 화면으로 바꿔 보기 (같은 페이지를 창 두 개로 열어 연결을 시험할 때도) */
  bView.onclick=()=>{preview=!preview;bView.setAttribute('aria-pressed',preview);bView.textContent=preview?'선생님 화면으로':'학생 화면 보기';
    document.body.classList.toggle('view',preview);board.view(preview);mon.hidden=true;
    if(preview){role='view';applied=0;lastSc='';const r=cur&&(!remote||cur.rev>=remote.rev)?cur:remote;if(r)apply(r,true);showInk(false);}
    else{role='teacher';lastJ='';changed();}
    paintLive();};

  /* --- 들어오기: 선생님(구글 로그인 + 쓰기 권한) / 학생(익명) --- */
  async function canTeach(){try{await db.ref('photo32/live/ping').set(FB.database.ServerValue.TIMESTAMP);return true;}catch(e){return false;}}
  function askLogin(wrong){loginEl.hidden=false;gate();
    $('loginT').textContent=wrong?'선생님 계정이 아니에요':'선생님 로그인';
    $('loginP').textContent=wrong?`${auth.currentUser.email||'이 계정'}은 수업 기록을 쓸 수 없어요. Firebase 규칙에 적은 메일로 로그인하세요.`:'구글 계정으로 로그인하면 이 화면에서 수업을 진행할 수 있어요.';
    $('loginBtn').textContent=wrong?'다른 구글 계정으로 로그인':'Google로 로그인';}
  $('loginBtn').onclick=async()=>{const p=new FB.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});$('loginBtn').disabled=true;
    try{await auth.signInWithPopup(p);if(await canTeach())return asTeacher();askLogin(true);}
    catch(e){const c=e&&e.code||'';
      if(/popup-blocked|operation-not-supported/.test(c)){auth.signInWithRedirect(p);return;}
      $('loginP').textContent=/unauthorized-domain/.test(c)?'이 사이트 주소가 Firebase에 등록되지 않았어요. Authentication → 설정 → 승인된 도메인에 추가하세요.'
        :/popup-closed|cancelled-popup/.test(c)?'로그인 창이 닫혔어요. 다시 눌러 주세요.':'로그인하지 못했어요 ('+c+')';}
    finally{$('loginBtn').disabled=false;}};
  $('loginStu').onclick=()=>{loginEl.hidden=true;asStudent();};
  async function asTeacher(){loginEl.hidden=true;owner=true;
    const [a,b]=await Promise.all([db.ref('photo32/live/state').once('value'),db.ref('photo32/live/ink').once('value')]).catch(()=>[null,null]);   // 수업 중 새로고침해도 이어서
    applying=true;
    try{const x=b&&b.val();if(x&&okN(x.k)){ink={k:x.k,s:strokes(x.s)};seq=Math.max(0,...ink.s.map(s=>s.q||0));}
      const s=a&&a.val();if(valid(s)){apply(s,false);remote=s;hasState=true;maxRev=Math.max(maxRev,s.rev);}}
    finally{applying=false;}
    if(ink.k===k)board.set(ink.s);
    role='teacher';document.body.classList.remove('view');bView.hidden=false;gate();commit();
    db.ref('photo32/live/state').on('value',sn=>{const d=sn.val();if(d)onState(d);});
    db.ref('photo32/presence').on('value',sn=>onPresence(sn.val()),()=>setErr('학생 상태를 읽을 수 없어요 · 규칙을 확인하세요'));
    live.hidden=false;paintLive();}
  async function asStudent(){try{if(!auth.currentUser)await auth.signInAnonymously();}
    catch(e){role='solo';document.body.classList.remove('view');live.hidden=false;setLive('연결 안 됨 · Firebase에서 익명 로그인을 켜 주세요','bad');return;}
    role='view';board.view(true);gate();
    myRef=db.ref('photo32/presence/'+auth.currentUser.uid+'/'+TAB);myRef.onDisconnect().remove();pres();
    db.ref('photo32/live/state').on('value',sn=>{const d=sn.val();if(d)onState(d);else paintLive();},()=>setErr('수업 기록을 읽을 수 없어요'));
    db.ref('photo32/live/ink').on('value',sn=>onInk(sn.val()),()=>{});
    live.hidden=false;paintLive();}
  async function init(){if(role!=='wait'){if(FB){live.hidden=false;setLive('Firebase 설정 전 · config.js를 채워 주세요','bad');}return;}
    try{FB.apps.length||FB.initializeApp(CFG);auth=FB.auth();db=FB.database();
      if(CFG.emulators){auth.useEmulator(CFG.emulators.auth);db.useEmulator(...CFG.emulators.db);}}   // 시험용(실제 설정에는 없음)
    catch(e){role='solo';document.body.classList.remove('view');live.hidden=false;setLive('연결 안 됨 · config.js 설정을 확인하세요','bad');return;}
    db.ref('.info/connected').on('value',s=>{online=!!s.val();if(online&&myRef){myRef.onDisconnect().remove();pres();}paintLive();});
    const u=await new Promise(res=>{const off=auth.onAuthStateChanged(x=>{off();res(x);});});
    if(u&&!u.isAnonymous&&await canTeach())return asTeacher();
    if(TEACH)return askLogin(!!(u&&!u.isAnonymous));
    asStudent();}
  return {changed,init};})();

<script>/* 통합 사이트: 선생님 탭이 보고 있는 단원을 hub/live에 알리고, 학생 화면은 그 단원으로 저절로 넘어간다 */
(()=>{const UNITS=["2-2", "3-1", "3-2", "5-2", "6-1", "6-2", "6-3"],U=(location.pathname.match(/\/(\d-\d)\//)||[])[1],FB=window.firebase;const on=v=>!!(v&&v.tabs&&typeof v.tabs==='object'&&Object.keys(v.tabs).length);
 if(!U||!UNITS.includes(U)||!FB||!FB.apps.length)return;
 const db=FB.database(),hub=db.ref('hub/live'),TAB=Math.random().toString(36).slice(2,8);let seen=false;
 FB.auth().onAuthStateChanged(u=>{if(!u||seen)return;seen=true;
  if(!u.isAnonymous){   // 선생님(규칙에 적은 메일이 아니면 쓰기가 거절되어 아무 일도 없음)
   const me=hub.child('tabs/'+TAB),show=()=>{if(document.visibilityState==='visible')hub.update({unit:U,at:FB.database.ServerValue.TIMESTAMP}).catch(()=>{});};
   db.ref('.info/connected').on('value',s=>{if(s.val())me.onDisconnect().remove().then(()=>me.set(U)).then(show).catch(()=>{});});
   document.addEventListener('visibilitychange',show);addEventListener('focus',show);return;}
  hub.on('value',s=>{const v=s.val();if(on(v)&&UNITS.includes(v.unit)&&v.unit!==U)location.replace('../'+v.unit+'/');},()=>{});});})();
</script>
