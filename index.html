<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>문학과 영상 장면 탐험</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* Layout: 밤 무대 머리띠(제목) → 단원 3줄(번호 칸 | 제목·질문·짜임·버튼). 좁으면 번호가 제목 위로. */
:root{--bg:#eceff6;--surface:#fff;--ink:#141a2d;--muted:#596181;--line:#d6dbe8;--accent:#2a61d6;--accent-ink:#fff;--chip:#e2e7f3;
 --stage:#090e21;--stage-ink:#e5e9f5;--stage-mute:#97a0bd;--hot:#c95f17;--dot-ok:#3fcf92;--dot-bad:#ff6f61;
 --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;--serif:"Nanum Myeongjo","AppleMyungjo",serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0e1b;--surface:#121a2e;--ink:#e5e9f5;--muted:#97a0bd;--line:#252e48;--accent:#6ea4ff;--accent-ink:#0a0e1b;--chip:#1c2540;--stage:#060a18;--hot:#ff9a3c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0e1b;--surface:#121a2e;--ink:#e5e9f5;--muted:#97a0bd;--line:#252e48;--accent:#6ea4ff;--accent-ink:#0a0e1b;--chip:#1c2540;--stage:#060a18;--hot:#ff9a3c;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--stage);color:var(--stage-ink);background-image:radial-gradient(1.2px 1.2px at 12% 30%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 68% 22%,#fff6 50%,transparent 51%),radial-gradient(1.4px 1.4px at 86% 64%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 40% 74%,#fff5 50%,transparent 51%)}
header .wrap{padding-block:34px 30px}
.eyebrow{margin:0;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--stage-mute)}
h1{margin:6px 0 4px;font-family:var(--serif);font-weight:800;font-size:clamp(30px,6vw,42px);letter-spacing:-.01em;text-wrap:balance}
.sub{margin:0;color:var(--stage-mute)}
.tmode{display:inline-block;margin-top:12px;padding:2px 10px;border-radius:999px;background:var(--hot);color:#fff;font-size:13px;font-weight:600}
.st{display:inline-flex;align-items:center;gap:8px;margin:14px 0 0;padding:5px 14px;border-radius:999px;background:#ffffff14;color:var(--stage-ink);font-size:14px}
.st::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--stage-mute)}
.st.ok::before{background:var(--dot-ok)}.st.bad::before{background:var(--dot-bad)}
main .wrap{padding-block:8px 40px}
.unit{display:grid;grid-template-columns:96px minmax(0,1fr);gap:20px;padding-block:28px;border-bottom:1px solid var(--line)}
.code{font-family:var(--mono);font-size:30px;line-height:1.1;color:var(--muted);font-variant-numeric:tabular-nums}
.code small{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.06em;margin-top:4px}
h2{margin:0;font-family:var(--serif);font-weight:800;font-size:22px;line-height:1.35;text-wrap:balance}
.meta{margin:2px 0 14px;color:var(--muted);font-size:14px}
.q{margin:0 0 16px;padding-left:14px;border-left:3px solid var(--hot)}
.q b{display:block;font-size:12px;letter-spacing:.06em;color:var(--hot)}
.q span{font-family:var(--serif);font-weight:700;font-size:16px}
.q i{font-style:normal;color:var(--muted);font-size:13px;margin-left:4px;white-space:nowrap}
.bar{display:flex;gap:3px;height:26px}
.bar span{min-width:3.6em;display:flex;align-items:center;justify-content:center;border-radius:4px;font-family:var(--mono);font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
.bar span:nth-child(1){background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.bar span:nth-child(2){background:color-mix(in srgb,var(--accent) 30%,var(--surface))}
.bar span:nth-child(3){background:color-mix(in srgb,var(--accent) 46%,var(--surface))}
.bar span:nth-child(4){background:color-mix(in srgb,var(--accent) 64%,var(--surface));color:var(--accent-ink)}
.flow{margin:6px 0 18px;font-size:13px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts a{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.acts a:hover{border-color:var(--accent)}
.acts a.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.acts a small{font-weight:500;color:var(--muted);font-size:12px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{margin:22px 0 0;color:var(--muted);font-size:13px}
.note code{font-family:var(--mono);background:var(--chip);padding:0 5px;border-radius:4px}
@media (max-width:560px){.unit{grid-template-columns:minmax(0,1fr);gap:8px}.code{font-size:22px}.code small{display:inline;margin-left:8px}}
</style>
</head>
<body>
<header><div class="wrap"><p class="eyebrow">문학과 영상 · 1단원</p><h1>장면 탐험</h1><p class="sub">옷소매 붉은 끝동 · 11장면을 그림 단계로 하나씩</p><p class="tmode" hidden id="tm">선생님 화면으로 열림</p><p class="st" id="st" role="status" hidden></p></div></header>
<main><div class="wrap"><section class="unit" aria-labelledby="u1-1"><div class="code">1-1<small>단원</small></div><div>
<h2 id="u1-1">옷소매 붉은 끝동 — 문학과 영상의 상호 작용</h2><p class="meta">드라마 대본 · 원작 소설 · 〈한중록〉 · 11장면</p>
<p class="q"><b>이 단원의 질문</b><span>문학 작품과 영상물은 서로 어떤 영향을 주고받고, 그 효과는 무엇일까?</span><i>(p.10~29)</i></p>
<div class="bar" role="img" aria-label="단원의 짜임: 들어가며 1장면, 2회 3장면, 5회 4장면, 비교 3장면"><span style="flex:1" title="1장면">1</span><span style="flex:3" title="2~4장면">2–4</span><span style="flex:4" title="5~8장면">5–8</span><span style="flex:3" title="9~11장면">9–11</span></div>
<p class="flow">들어가며 → 2회 서고의 첫 만남 → 5회 모함·시경·맹세 → 문학 ↔ 영상 비교</p>

</body>
</html>
